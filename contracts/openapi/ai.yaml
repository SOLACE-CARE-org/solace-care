openapi: 3.1.0
info:
  title: Solace Ai API
  version: 0.4.0
  description: |
    AI: the safety monitor, and from Phase 3 the assist features behind the model gateway (D56).
    Reached through the gateway at /api/ai. Every feature is off until its evaluation passes in
    English and French, a Clinical reviewer signs off, and a Super admin switches it on.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/ai
    description: Through the gateway (http://localhost:8080 locally)
security:
  - bearerAuth: []
tags:
  - name: system
    description: Platform plumbing, no user data
  - name: brief
    description: The pre-session brief for the booking's specialist (Phase 3; D56)
  - name: admin-ai
    description: AI controls, admin screen 26 (D56)
  - name: notes
    description: Session scribe, the specialist's note drafts and signed notes (Phase 4; D57)
  - name: homework
    description: Homework set by the specialist and the companion that guides it (Phase 4; D57)
  - name: admin-copilot
    description: Admin copilot, screen 27 (Phase 4; D58). Aggregated, de-identified numbers only
  - name: admin-jobs
    description: This service's scheduled jobs and their trigger rows, for staff (D61). A change takes effect at the service's next restart.
paths:
  /v1/system/info:
    get:
      operationId: info
      summary: Service name and version
      tags: [system]
      responses:
        "200":
          description: Service info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/specialist/bookings/{bookingId}/brief:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPreSessionBrief
      summary: The booking's facts, the health check the seeker shared and their consented tracking trend
      description: |
        Only for the booking's specialist. The health check part is a summary built by rules (no AI
        reads health check answers, D8); a model may word only the tracking trend, from numbers.
        Nothing is stored.
      tags: [brief]
      responses:
        "200":
          description: The brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/ai/features:
    get:
      operationId: adminAiOverview
      summary: Every AI feature with its route, live and candidate versions, evaluations and the safety gate
      tags: [admin-ai]
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/ai/features/{feature}/versions:
    parameters:
      - $ref: "#/components/parameters/Feature"
    get:
      operationId: adminAiVersions
      summary: A feature's prompt and policy versions, newest first
      tags: [admin-ai]
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminAiDraftVersion
      summary: A new draft prompt and policy (Super admin)
      tags: [admin-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [system, policy]
              properties:
                system:
                  type: string
                  maxLength: 8000
                policy:
                  type: string
                  maxLength: 4000
      responses:
        "201":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/ai/features/{feature}/switch:
    parameters:
      - $ref: "#/components/parameters/Feature"
    put:
      operationId: adminAiSwitch
      summary: Turn a feature on (only with a passing evaluation of its live version) or off, with a reason
      tags: [admin-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, reason]
              properties:
                enabled:
                  type: boolean
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: The feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFeature"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai/versions/{versionId}/evaluation:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: adminAiEvaluate
      summary: Run the feature's bilingual test set with this version; made-up cases only
      tags: [admin-ai]
      responses:
        "200":
          $ref: "#/components/responses/PromptVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/ai/versions/{versionId}/sign-off:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: adminAiSignOff
      summary: A Clinical reviewer signs off the graded sample of a passing evaluation
      tags: [admin-ai]
      responses:
        "200":
          $ref: "#/components/responses/PromptVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai/versions/{versionId}/promotion:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: adminAiPromote
      summary: Make a signed-off, passing draft the live version; the old one retires
      tags: [admin-ai]
      responses:
        "200":
          $ref: "#/components/responses/PromptVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/specialist/notes:
    get:
      operationId: listNotes
      summary: The specialist's note drafts and signed notes, newest first
      description: Every call is audited as a clinical read. Drafts not signed within 7 days are deleted, with the audio.
      tags: [notes]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NoteStatus"
        - name: q
          in: query
          required: false
          description: Words to find in the notes
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/specialist/notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: getNote
      summary: One note, for its specialist; audited
      tags: [notes]
      responses:
        "200":
          $ref: "#/components/responses/NoteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: editNote
      summary: Saves the specialist's edits to a draft
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteEdit"
      responses:
        "200":
          $ref: "#/components/responses/NoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: discardNote
      summary: Discards a draft; its transcript and the session audio are deleted
      tags: [notes]
      responses:
        "204":
          description: Discarded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/specialist/notes/{noteId}/redraft:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    post:
      operationId: redraftNote
      summary: Drafts the note again from the transcript in the other format (SOAP or DAP)
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [format]
              properties:
                format:
                  $ref: "#/components/schemas/NoteFormat"
      responses:
        "200":
          $ref: "#/components/responses/NoteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/specialist/notes/{noteId}/signature:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    post:
      operationId: signNote
      summary: Signs a draft once every section is filled; the transcript and the session audio are deleted
      tags: [notes]
      responses:
        "200":
          $ref: "#/components/responses/NoteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/specialist/bookings/{bookingId}/homework:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listBookingHomework
      summary: Homework the specialist set after this booking, with progress
      tags: [homework]
      responses:
        "200":
          description: The homework
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Homework"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: assignHomework
      summary: Sets homework for the booking's seeker (AssignHomework.dc.html)
      tags: [homework]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeworkAssignment"
      responses:
        "201":
          description: Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Homework"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/homework:
    get:
      operationId: myHomework
      summary: The seeker's open and recent homework
      tags: [homework]
      responses:
        "200":
          description: The homework
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Homework"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/homework/{homeworkId}/companion:
    parameters:
      - name: homeworkId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: companionState
      summary: Where the seeker is in the current exercise, and the companion's next question
      tags: [homework]
      responses:
        "200":
          $ref: "#/components/responses/CompanionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: companionAnswer
      summary: The seeker's answer to the current step
      description: |
        Every answer passes the safety monitor before the companion replies. On a risk signal the
        companion stops, says so and hands off to urgent help (crisis true); the alert reaches the
        on-call team. Answers are stored for the seeker only.
      tags: [homework]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answer]
              properties:
                answer:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          $ref: "#/components/responses/CompanionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/copilot/questions:
    post:
      operationId: askCopilot
      summary: Answers a question with one aggregated metric and the table behind it
      description: |
        Staff with Analytics access. Either a metric from the catalogue (always answered, no model
        needed) or a question in words, which a model maps to one metric while the copilot is on.
        The answer is worded only from the table; it cannot look up a person or change anything.
        Every question is audited.
      tags: [admin-copilot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotQuestion"
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai-models:
    get:
      operationId: listAiModels
      summary: AI models, with whether their keys are found (D61)
      tags: [admin-ai]
      responses:
        "200":
          description: Every model
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAiModel
      summary: Add a model as a DRAFT (Super admin only, D61)
      tags: [admin-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelDraft"
      responses:
        "201":
          description: The new model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai-models/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,40}$"
    put:
      operationId: changeAiModel
      summary: Change a model or its status, with a reason (Super admin only, D61)
      description: ACTIVE needs the key of a model Solace does not host. A model a route uses cannot be disabled.
      tags: [admin-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelChange"
      responses:
        "200":
          description: The model after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai-routes:
    get:
      operationId: listAiRoutes
      summary: Each feature's live route, any pending change with its evaluation, and its budget (D61)
      tags: [admin-ai]
      responses:
        "200":
          description: One entry per feature
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiRoute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/ai-routes/{feature}:
    parameters:
      - $ref: "#/components/parameters/AiFeaturePath"
    put:
      operationId: proposeAiRoute
      summary: Save a pending route for the feature (Super admin only, D61)
      description: It goes live only after the feature's evaluation passes on it with the live prompt version.
      tags: [admin-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [models, reason]
              properties:
                models:
                  description: Active chat models, in the order to try them.
                  type: array
                  maxItems: 10
                  items:
                    type: string
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: The feature's routes after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRoute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/ai-routes/{feature}/evaluation:
    parameters:
      - $ref: "#/components/parameters/AiFeaturePath"
    post:
      operationId: evaluateAiRoute
      summary: Run the feature's evaluation set with its live version on the pending route
      tags: [admin-ai]
      responses:
        "200":
          description: The evaluation run
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai-routes/{feature}/promotion:
    parameters:
      - $ref: "#/components/parameters/AiFeaturePath"
    post:
      operationId: promoteAiRoute
      summary: Put the pending route live once its evaluation passed (Super admin only)
      tags: [admin-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: The feature's routes after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRoute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai-routes/{feature}/pending:
    parameters:
      - $ref: "#/components/parameters/AiFeaturePath"
    delete:
      operationId: discardAiRoute
      summary: Drop the pending route (Super admin only)
      tags: [admin-ai]
      responses:
        "200":
          description: The feature's routes after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRoute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai-features/{feature}/budget:
    parameters:
      - $ref: "#/components/parameters/AiFeaturePath"
    put:
      operationId: changeAiBudget
      summary: Set the feature's monthly token budget, with a reason (Super admin only)
      tags: [admin-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokens, reason]
              properties:
                tokens:
                  type: integer
                  minimum: 0
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: The feature's routes and budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRoute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/jobs:
    get:
      operationId: listJobs
      summary: This service's scheduled jobs, their rows and their last runs (D61)
      tags: [admin-jobs]
      responses:
        "200":
          description: Every job
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobTrigger"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/jobs/{name}:
    parameters:
      - $ref: "#/components/parameters/JobName"
    put:
      operationId: changeJob
      summary: Pause, resume or reschedule a job with a reason (Super admin only, D61)
      description: Saved at once; the running service follows it from its next restart. A paused job is not registered, so it does not run. Any job can be paused, crisis escalation included.
      tags: [admin-jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTriggerChange"
      responses:
        "200":
          description: The job after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTrigger"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/jobs/{name}/history:
    parameters:
      - $ref: "#/components/parameters/JobName"
    get:
      operationId: getJobHistory
      summary: Every version of a job's row, newest first
      tags: [admin-jobs]
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobTriggerVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token
  parameters:
    AiFeaturePath:
      name: feature
      in: path
      required: true
      schema:
        type: string
        x-extensible-enum: [TRACKING_INSIGHTS, PRE_SESSION_BRIEF, REVIEW_MODERATION, TRANSLATION, SESSION_SCRIBE, COMPANION, ADMIN_COPILOT]
    JobName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9.-]{2,80}$"
    Feature:
      name: feature
      in: path
      required: true
      schema:
        type: string
        enum: [TRACKING_INSIGHTS, PRE_SESSION_BRIEF, REVIEW_MODERATION, TRANSLATION, SESSION_SCRIBE, COMPANION, ADMIN_COPILOT]
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is not valid; code says why
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NoteResponse:
      description: The note
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Note"
    CompanionResponse:
      description: The companion's turn
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompanionTurn"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Not in a state that allows this
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PromptVersionResponse:
      description: The version after the change
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromptVersion"
  schemas:
    AiModel:
      type: object
      additionalProperties: false
      required: [name, kind, url, model, local, secretRef, status, priority, version, updatedBy, updatedAt, keyFound]
      properties:
        name:
          type: string
        kind:
          type: string
          x-extensible-enum: [CHAT, SPEECH, EMBEDDING]
        url:
          type: string
        model:
          type: string
        local:
          description: Hosted by Solace. Only local models get health data until aiTransferAuthorised is on.
          type: boolean
        secretRef:
          description: Where its key is in Vault; never the key.
          type: string
        status:
          type: string
          x-extensible-enum: [DRAFT, ACTIVE, DISABLED]
        priority:
          description: The order speech and embedding models are tried in.
          type: integer
        version:
          type: integer
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        keyFound:
          type: boolean
    AiModelDraft:
      type: object
      additionalProperties: false
      required: [name, kind, url, model, local, secretRef, priority, reason]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,40}$"
        kind:
          type: string
          x-extensible-enum: [CHAT, SPEECH, EMBEDDING]
        url:
          description: https; http only for a model Solace hosts.
          type: string
          maxLength: 200
        model:
          type: string
          maxLength: 120
        local:
          type: boolean
        secretRef:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"
        priority:
          type: integer
          minimum: 1
          maximum: 10
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AiModelChange:
      type: object
      additionalProperties: false
      required: [version, url, model, local, secretRef, status, priority, reason]
      properties:
        version:
          type: integer
          minimum: 1
        url:
          type: string
          maxLength: 200
        model:
          type: string
          maxLength: 120
        local:
          type: boolean
        secretRef:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"
        status:
          type: string
          x-extensible-enum: [DRAFT, ACTIVE, DISABLED]
        priority:
          type: integer
          minimum: 1
          maximum: 10
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AiRoute:
      type: object
      additionalProperties: false
      required: [feature, live]
      properties:
        feature:
          type: string
        live:
          description: Chat models tried in this order.
          type: array
          items:
            type: string
        pending:
          description: A change waiting for its evaluation.
          type: array
          items:
            type: string
        proposedBy:
          type: string
        proposedAt:
          type: string
          format: date-time
        pendingPassed:
          description: Whether the latest evaluation on the pending route passed.
          type: boolean
        monthlyBudget:
          description: Tokens a month; absent while the configured budget counts.
          type: integer
    JobTriggerStatus:
      description: ACTIVE jobs are registered when the service starts; PAUSED ones are not, so they do not run.
      type: string
      x-extensible-enum: [ACTIVE, PAUSED]
    JobTriggerKind:
      type: string
      x-extensible-enum: [CRON, INTERVAL]
    JobTrigger:
      type: object
      additionalProperties: false
      required: [name, description, status, caution, kind, schedule, version, updatedBy, updatedAt, pendingRestart]
      properties:
        name:
          type: string
        description:
          description: What the job does, from the code.
          type: string
        status:
          $ref: "#/components/schemas/JobTriggerStatus"
        caution:
          description: Safety or money depends on it (crisis escalation, payments, sessions, reminders). It can still be paused or rescheduled; the portal warns first.
          type: boolean
        kind:
          $ref: "#/components/schemas/JobTriggerKind"
        schedule:
          description: A six-field cron for CRON, an ISO-8601 duration for INTERVAL.
          type: string
        zone:
          description: The cron's time zone.
          type: string
        version:
          type: integer
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        pendingRestart:
          description: The row was changed since the service started; it follows the row from its next restart.
          type: boolean
        lastStartedAt:
          type: string
          format: date-time
        lastFinishedAt:
          type: string
          format: date-time
        lastOutcome:
          type: string
          x-extensible-enum: [OK, FAILED]
        nextRunAt:
          type: string
          format: date-time
    JobTriggerChange:
      type: object
      additionalProperties: false
      required: [version, status, schedule, reason]
      properties:
        version:
          description: The version read; a change made meanwhile answers 409.
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/JobTriggerStatus"
        schedule:
          description: Of the job's kind; an interval is at least 5 seconds.
          type: string
          maxLength: 120
        zone:
          type: string
          maxLength: 60
        reason:
          type: string
          minLength: 1
          maxLength: 500
    JobTriggerVersion:
      type: object
      additionalProperties: false
      required: [version, status, kind, schedule, reason, changedBy, changedAt]
      properties:
        version:
          type: integer
        status:
          $ref: "#/components/schemas/JobTriggerStatus"
        kind:
          $ref: "#/components/schemas/JobTriggerKind"
        schedule:
          type: string
        zone:
          type: string
        reason:
          type: string
        changedBy:
          type: string
        changedAt:
          type: string
          format: date-time
    Problem:
      description: RFC 9457 problem details. title and detail are localised to the caller's language.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable error code, e.g. booking.slot-taken
        traceId:
          type: string
    ServiceInfo:
      type: object
      additionalProperties: false
      required: [service, version]
      properties:
        service:
          type: string
        version:
          type: string
    Brief:
      type: object
      additionalProperties: false
      required: [startsAt, modality, sessionLanguage, guest, firstSession, healthCheckShared, scores, healthCheckSafetyStop, scribeConsent]
      properties:
        startsAt:
          type: string
          format: date-time
        modality:
          type: string
        sessionLanguage:
          type: string
        guest:
          type: boolean
        firstSession:
          type: boolean
        healthCheckShared:
          type: boolean
        healthCheckSharedAt:
          type: string
          format: date-time
        healthCheckSummary:
          description: Built by rules from the shared answers, in the specialist's language.
          type: string
        scores:
          description: Screener totals and their published bands, for the specialist only.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [screener, total, band]
            properties:
              screener:
                type: string
              total:
                type: integer
              band:
                type: string
        healthCheckSafetyStop:
          type: boolean
        scribeConsent:
          type: boolean
        tracking:
          description: Absent when the seeker shared no tracking with this specialist.
          type: object
          additionalProperties: false
          required: [aiWorded, lines]
          properties:
            summary:
              description: A model's two or three sentences from the lines; absent when off or refused.
              type: string
            aiWorded:
              type: boolean
            lines:
              description: The facts, built by rules.
              type: array
              items:
                type: string
    EvalSummary:
      type: object
      additionalProperties: false
      required: [id, passedEn, totalEn, passedFr, totalFr, passed, failures, ranAt]
      properties:
        id:
          type: string
          format: uuid
        passedEn:
          type: integer
        totalEn:
          type: integer
        passedFr:
          type: integer
        totalFr:
          type: integer
        passed:
          type: boolean
        failures:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [caseId, locale, reason]
            properties:
              caseId:
                type: string
              locale:
                type: string
              reason:
                type: string
        ranAt:
          type: string
          format: date-time
    PromptVersion:
      type: object
      additionalProperties: false
      required: [id, version, status, system, policy, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        status:
          type: string
          enum: [DRAFT, LIVE, RETIRED]
        system:
          type: string
        policy:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        signedOffBy:
          type: string
        promotedAt:
          type: string
          format: date-time
        evaluation:
          $ref: "#/components/schemas/EvalSummary"
    AiFeature:
      type: object
      additionalProperties: false
      required: [feature, enabled, routes]
      properties:
        feature:
          type: string
        enabled:
          type: boolean
        routes:
          description: The model names tried in order.
          type: array
          items:
            type: string
        live:
          $ref: "#/components/schemas/PromptVersion"
        candidate:
          $ref: "#/components/schemas/PromptVersion"
        changedBy:
          type: string
        changedAt:
          type: string
          format: date-time
    AiOverview:
      type: object
      additionalProperties: false
      required: [safetyMonitor, features]
      properties:
        safetyMonitor:
          type: object
          additionalProperties: false
          required: [classifier, policy, recallEn, recallFr, gate, passing]
          properties:
            classifier:
              type: string
            policy:
              type: string
            recallEn:
              type: number
            recallFr:
              type: number
            gate:
              type: number
            passing:
              description: False until the clinical team's safety set is supplied and recall meets the gate in both languages.
              type: boolean
        features:
          type: array
          items:
            $ref: "#/components/schemas/AiFeature"
    NoteStatus:
      type: string
      enum: [DRAFT, SIGNED]
    NoteFormat:
      type: string
      enum: [SOAP, DAP]
    NoteSection:
      type: object
      additionalProperties: false
      required: [key, text]
      properties:
        key:
          description: S, O, A, P for SOAP; D, A, P for DAP. The AI leaves the assessment empty for the specialist.
          type: string
          enum: [S, O, D, A, P]
        text:
          type: string
          maxLength: 4000
    NoteSummary:
      type: object
      additionalProperties: false
      required: [id, bookingId, status, format, preview, createdAt]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/NoteStatus"
        format:
          $ref: "#/components/schemas/NoteFormat"
        preview:
          description: The start of the first section
          type: string
        createdAt:
          type: string
          format: date-time
        signedAt:
          type: string
          format: date-time
        deleteAt:
          description: When an unsigned draft and the session audio are deleted
          type: string
          format: date-time
    Note:
      type: object
      additionalProperties: false
      required: [id, bookingId, status, format, sections, aiDrafted, riskSignals, createdAt]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/NoteStatus"
        format:
          $ref: "#/components/schemas/NoteFormat"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/NoteSection"
        aiDrafted:
          type: boolean
        riskSignals:
          description: True when the safety monitor flagged the transcript, for the specialist to follow up
          type: boolean
        canRedraft:
          description: True while the transcript is kept, so the other format can be drafted
          type: boolean
        createdAt:
          type: string
          format: date-time
        signedAt:
          type: string
          format: date-time
        deleteAt:
          type: string
          format: date-time
    NoteEdit:
      type: object
      additionalProperties: false
      required: [format, sections]
      properties:
        format:
          $ref: "#/components/schemas/NoteFormat"
        sections:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/NoteSection"
    Exercise:
      type: string
      enum: [THOUGHT_RECORD, SLEEP_DIARY, WORRY_TIME, CUSTOM]
    HomeworkAssignment:
      type: object
      additionalProperties: false
      required: [exercise, frequency, companionGuided]
      properties:
        exercise:
          $ref: "#/components/schemas/Exercise"
        customTask:
          description: Required for CUSTOM
          type: string
          maxLength: 300
        frequency:
          type: string
          enum: [TIMES, DAILY, ONCE]
        times:
          description: Required for TIMES; how many before the next session
          type: integer
          minimum: 1
          maximum: 14
        note:
          description: A message to the seeker
          type: string
          maxLength: 500
        companionGuided:
          type: boolean
        dueBy:
          description: Defaults to the start of the next booking with this seeker, or [7] days
          type: string
          format: date-time
    Homework:
      type: object
      additionalProperties: false
      required: [id, bookingId, exercise, frequency, target, done, companionGuided, dueBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        specialistId:
          type: string
          format: uuid
        exercise:
          $ref: "#/components/schemas/Exercise"
        customTask:
          type: string
        frequency:
          type: string
          enum: [TIMES, DAILY, ONCE]
        target:
          description: How many make it complete (days until due for DAILY)
          type: integer
        done:
          type: integer
        note:
          type: string
        companionGuided:
          type: boolean
        dueBy:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CompanionTurn:
      type: object
      additionalProperties: false
      required: [step, prompt, record, done, target, finished, crisis]
      properties:
        step:
          description: The step the next answer fills
          type: string
          enum: [SITUATION, THOUGHT, FEELING, KINDER_VIEW, BEDTIME, WAKE_TIME, RESTED, WORRIES, TASK, DONE]
        prompt:
          description: The companion's next words, in the app language
          type: string
        aiWorded:
          description: True when a model worded the reflection, only from vetted content
          type: boolean
        record:
          description: The answers so far in the current record, by step
          type: object
          additionalProperties:
            type: string
        done:
          type: integer
        target:
          type: integer
        finished:
          description: True when the homework is complete
          type: boolean
        crisis:
          description: True when the safety monitor flagged the answer; the app opens urgent help
          type: boolean
    CopilotMetric:
      type: string
      enum: [BOOKINGS_BY_SOURCE, INVITES_BY_MODULE, SESSIONS_BY_LANGUAGE, SESSIONS_BY_MODALITY, PAYMENTS_BY_STATUS, RATINGS, BOOKINGS_BY_STATUS]
    CopilotPeriod:
      type: string
      enum: [LAST_7_DAYS, LAST_30_DAYS, LAST_MONTH, THIS_QUARTER]
    CopilotQuestion:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          maxLength: 300
        metric:
          $ref: "#/components/schemas/CopilotMetric"
        period:
          $ref: "#/components/schemas/CopilotPeriod"
    CopilotAnswer:
      type: object
      additionalProperties: false
      required: [answer, aiWorded, metric, period, columns, rows, source, from, to, suppressed]
      properties:
        answer:
          type: string
        aiWorded:
          type: boolean
        metric:
          $ref: "#/components/schemas/CopilotMetric"
        period:
          $ref: "#/components/schemas/CopilotPeriod"
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        source:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        suppressed:
          description: Some counts were under the minimum size and show as "<5"
          type: boolean
