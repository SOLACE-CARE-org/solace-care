openapi: 3.1.0
info:
  title: Solace Ai API
  version: 0.2.0
  description: |
    AI: the safety monitor, and from Phase 3 the assist features behind the model gateway (D56).
    Reached through the gateway at /api/ai. Every feature is off until its evaluation passes in
    English and French, a Clinical reviewer signs off, and a Super admin switches it on.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/ai
    description: Through the gateway (http://localhost:8080 locally)
security:
  - bearerAuth: []
tags:
  - name: system
    description: Platform plumbing, no user data
  - name: brief
    description: The pre-session brief for the booking's specialist (Phase 3; D56)
  - name: admin-ai
    description: AI controls, admin screen 26 (D56)
paths:
  /v1/system/info:
    get:
      operationId: info
      summary: Service name and version
      tags: [system]
      responses:
        "200":
          description: Service info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/specialist/bookings/{bookingId}/brief:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPreSessionBrief
      summary: The booking's facts, the health check the seeker shared and their consented tracking trend
      description: |
        Only for the booking's specialist. The health check part is a summary built by rules (no AI
        reads health check answers, D8); a model may word only the tracking trend, from numbers.
        Nothing is stored.
      tags: [brief]
      responses:
        "200":
          description: The brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/ai/features:
    get:
      operationId: adminAiOverview
      summary: Every AI feature with its route, live and candidate versions, evaluations and the safety gate
      tags: [admin-ai]
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/ai/features/{feature}/versions:
    parameters:
      - $ref: "#/components/parameters/Feature"
    get:
      operationId: adminAiVersions
      summary: A feature's prompt and policy versions, newest first
      tags: [admin-ai]
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminAiDraftVersion
      summary: A new draft prompt and policy (Super admin)
      tags: [admin-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [system, policy]
              properties:
                system:
                  type: string
                  maxLength: 8000
                policy:
                  type: string
                  maxLength: 4000
      responses:
        "201":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/ai/features/{feature}/switch:
    parameters:
      - $ref: "#/components/parameters/Feature"
    put:
      operationId: adminAiSwitch
      summary: Turn a feature on (only with a passing evaluation of its live version) or off, with a reason
      tags: [admin-ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, reason]
              properties:
                enabled:
                  type: boolean
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: The feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFeature"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai/versions/{versionId}/evaluation:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: adminAiEvaluate
      summary: Run the feature's bilingual test set with this version; made-up cases only
      tags: [admin-ai]
      responses:
        "200":
          $ref: "#/components/responses/PromptVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/ai/versions/{versionId}/sign-off:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: adminAiSignOff
      summary: A Clinical reviewer signs off the graded sample of a passing evaluation
      tags: [admin-ai]
      responses:
        "200":
          $ref: "#/components/responses/PromptVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/ai/versions/{versionId}/promotion:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: adminAiPromote
      summary: Make a signed-off, passing draft the live version; the old one retires
      tags: [admin-ai]
      responses:
        "200":
          $ref: "#/components/responses/PromptVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token
  parameters:
    Feature:
      name: feature
      in: path
      required: true
      schema:
        type: string
        enum: [TRACKING_INSIGHTS, PRE_SESSION_BRIEF, REVIEW_MODERATION, TRANSLATION]
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Not in a state that allows this
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PromptVersionResponse:
      description: The version after the change
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromptVersion"
  schemas:
    Problem:
      description: RFC 9457 problem details. title and detail are localised to the caller's language.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable error code, e.g. booking.slot-taken
        traceId:
          type: string
    ServiceInfo:
      type: object
      additionalProperties: false
      required: [service, version]
      properties:
        service:
          type: string
        version:
          type: string
    Brief:
      type: object
      additionalProperties: false
      required: [startsAt, modality, sessionLanguage, guest, firstSession, healthCheckShared, scores, healthCheckSafetyStop, scribeConsent]
      properties:
        startsAt:
          type: string
          format: date-time
        modality:
          type: string
        sessionLanguage:
          type: string
        guest:
          type: boolean
        firstSession:
          type: boolean
        healthCheckShared:
          type: boolean
        healthCheckSharedAt:
          type: string
          format: date-time
        healthCheckSummary:
          description: Built by rules from the shared answers, in the specialist's language.
          type: string
        scores:
          description: Screener totals and their published bands, for the specialist only.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [screener, total, band]
            properties:
              screener:
                type: string
              total:
                type: integer
              band:
                type: string
        healthCheckSafetyStop:
          type: boolean
        scribeConsent:
          type: boolean
        tracking:
          description: Absent when the seeker shared no tracking with this specialist.
          type: object
          additionalProperties: false
          required: [aiWorded, lines]
          properties:
            summary:
              description: A model's two or three sentences from the lines; absent when off or refused.
              type: string
            aiWorded:
              type: boolean
            lines:
              description: The facts, built by rules.
              type: array
              items:
                type: string
    EvalSummary:
      type: object
      additionalProperties: false
      required: [id, passedEn, totalEn, passedFr, totalFr, passed, failures, ranAt]
      properties:
        id:
          type: string
          format: uuid
        passedEn:
          type: integer
        totalEn:
          type: integer
        passedFr:
          type: integer
        totalFr:
          type: integer
        passed:
          type: boolean
        failures:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [caseId, locale, reason]
            properties:
              caseId:
                type: string
              locale:
                type: string
              reason:
                type: string
        ranAt:
          type: string
          format: date-time
    PromptVersion:
      type: object
      additionalProperties: false
      required: [id, version, status, system, policy, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        status:
          type: string
          enum: [DRAFT, LIVE, RETIRED]
        system:
          type: string
        policy:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        signedOffBy:
          type: string
        promotedAt:
          type: string
          format: date-time
        evaluation:
          $ref: "#/components/schemas/EvalSummary"
    AiFeature:
      type: object
      additionalProperties: false
      required: [feature, enabled, routes]
      properties:
        feature:
          type: string
        enabled:
          type: boolean
        routes:
          description: The model names tried in order.
          type: array
          items:
            type: string
        live:
          $ref: "#/components/schemas/PromptVersion"
        candidate:
          $ref: "#/components/schemas/PromptVersion"
        changedBy:
          type: string
        changedAt:
          type: string
          format: date-time
    AiOverview:
      type: object
      additionalProperties: false
      required: [safetyMonitor, features]
      properties:
        safetyMonitor:
          type: object
          additionalProperties: false
          required: [classifier, policy, recallEn, recallFr, gate, passing]
          properties:
            classifier:
              type: string
            policy:
              type: string
            recallEn:
              type: number
            recallFr:
              type: number
            gate:
              type: number
            passing:
              description: False until the clinical team's safety set is supplied and recall meets the gate in both languages.
              type: boolean
        features:
          type: array
          items:
            $ref: "#/components/schemas/AiFeature"
