      tags: [admin-audit]
      parameters:
        - $ref: "#/components/parameters/AuditGroup"
        - $ref: "#/components/parameters/AuditQuery"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
      responses:
        "200":
          description: One line per entry
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/catalogue:
    get:
      operationId: getAdminCatalogue
      summary: Every specialty, session language and help topic, enabled or not, in EN and FR
      tags: [admin-catalogue]
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/catalogue/{kind}/{code}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [specialties, session-languages, help-topics]
      - name: code
        in: path
        required: true
        description: Lower case; a session language is an ISO 639 code (D16).
        schema:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          maxLength: 40
    put:
      operationId: saveCatalogueEntry
      summary: Add or change an entry; both EN and FR are required (CLAUDE.md, Language)
      tags: [admin-catalogue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [labelEn, labelFr, enabled, reason]
              properties:
                labelEn:
                  type: string
                  minLength: 1
                  maxLength: 80
                labelFr:
                  type: string
                  minLength: 1
                  maxLength: 80
                enabled:
                  type: boolean
                position:
                  description: Display order; a new entry goes last when absent.
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: The entry after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
