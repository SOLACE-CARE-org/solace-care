                  minimum: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "201":
          description: Proposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/refunds/{refundId}/approval:
    parameters:
      - $ref: "#/components/parameters/RefundId"
    post:
      operationId: approveRefund
      summary: Approve a proposed refund and send it (Finance, not the proposer)
      tags: [admin-payments]
      responses:
        "200":
          description: Approved; the transfer is on its way
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/refunds/{refundId}/decline:
    parameters:
      - $ref: "#/components/parameters/RefundId"
    post:
      operationId: declineRefund
      summary: Decline a proposed refund (Finance); the money goes to the specialist as for a completed session
      tags: [admin-payments]
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/refunds/{refundId}/retry:
    parameters:
      - $ref: "#/components/parameters/RefundId"
    post:
      operationId: retryRefund
      summary: Send a failed refund transfer again (change access to Payments); it was already approved
      tags: [admin-payments]
      responses:
        "200":
          description: Sent again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/reconciliation:
    get:
      operationId: getReconciliation
      summary: The latest daily reconciliation and its mismatches
      tags: [admin-payments]
      responses:
        "200":
          description: The latest run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reconciliation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/payout-runs:
    get:
      operationId: listPayoutRuns
      summary: Payout runs, newest first
      tags: [admin-payments]
      responses:
        "200":
          description: Up to 50 runs, without their items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayoutRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/payout-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getPayoutRun
      summary: One run with its items (admin screen 12)
      tags: [admin-payments]
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/payout-runs/{runId}/submission:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: submitPayoutRun
      summary: Prepare a drafted run for approval (Finance); its amounts are fixed from here
      tags: [admin-payments]
      responses:
        "200":
          description: Waiting for a second approver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/payout-runs/{runId}/approval:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: approvePayoutRun
      summary: Approve and send the ready payouts (another Finance member or a Super admin)
      tags: [admin-payments]
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/payout-runs/{runId}/items/{itemId}/hold:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: holdPayoutItem
      summary: Hold one specialist's payout in a drafted run, with a reason; it stays in their balance
      tags: [admin-payments]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: Held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: releasePayoutItem
      summary: Put a held item back in a drafted run
      tags: [admin-payments]
      responses:
        "200":
          description: Ready again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/bookings/{bookingId}/join:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      operationId: joinSession
      summary: A media token for the booking's room, from 10 minutes before the start (D18)
      description: For the booked seeker or the specialist. Valid until 15 minutes after the scheduled end.
      tags: [sessions]
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/guest/booking/join:
    post:
      operationId: joinSessionAsGuest
      summary: A media token for the guest's booking
      tags: [guests, sessions]
      security: []
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/webhooks/livekit:
    post:
      operationId: receiveLiveKitWebhook
      summary: The media server's room and participant events, for attendance (D36)
      description: Public at the gateway. The Authorization header carries LiveKit's signed token with the body's SHA-256; anything else gets 401.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema:
              type: object
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: Recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/bookings/{bookingId}/rating:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      operationId: rateSession
      summary: Rate a completed session, once (Rate your session; D37)
      tags: [reviews]
      requestBody:
        $ref: "#/components/requestBodies/Rating"
      responses:
        "201":
          description: Recorded; any written review waits for moderation
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/guest/booking/rating:
    post:
      operationId: rateSessionAsGuest
      summary: Rate the guest's completed session, once
      tags: [guests, reviews]
      security: []
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        $ref: "#/components/requestBodies/Rating"
      responses:
        "201":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/catalogue/specialists/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    get:
      operationId: listSpecialistReviews
      summary: Published reviews of a listed specialist, newest first; open to guests
      tags: [catalogue, reviews]
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: The reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicReview"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me/reviews:
    get:
      operationId: listMyReviews
      summary: The specialist's rating and published reviews (Reviews)
      tags: [reviews]
      responses:
        "200":
          description: Rating and reviews
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  rating:
                    $ref: "#/components/schemas/Rating"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/reviews/{reviewId}/reply:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    put:
      operationId: replyToReview
      summary: Reply publicly to one published review, once (D37)
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 600
      responses:
        "200":
          description: The review with its reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/reviews:
    get:
      operationId: listReviewsToModerate
      summary: Written reviews waiting for moderation, oldest first (admin screen 13)
      tags: [admin-reviews]
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModerationItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/reviews/{reviewId}/publication:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: publishReview
      summary: Publish a review, optionally with contact details masked
      tags: [admin-reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                maskContacts:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/reviews/{reviewId}/hiding:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: hideReview
      summary: Hide a review, with a reason; the stars still count
      tags: [admin-reviews]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: Hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/system/ping:
    get:
      operationId: ping
      summary: Phase 0 end-to-end slice
      description: Core calls Tracking and AI over gRPC, publishes core.system.pinged through the outbox, and reports which services answered.
      tags: [system]
      responses:
        "200":
          description: Result of the ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuestToken:
      name: X-Guest-Token
      in: header
      required: true
      description: The token from createGuestBooking (D34).
      schema:
        type: string
    SpecialistId:
      name: id
      in: path
      required: true
      description: The specialist's account id.
      schema:
        type: string
        format: uuid
  requestBodies:
    Rating:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [stars]
            properties:
              stars:
                type: integer
                minimum: 1
                maximum: 5
              tags:
                description: What stood out.
                type: array
                maxItems: 4
                uniqueItems: true
                items:
                  type: string
                  enum: [LISTENED, PRACTICAL_TOOLS, CALL_QUALITY, ON_TIME]
              text:
                description: Shown on the profile, without the seeker's name, once published.
                type: string
                maxLength: 1000
              privateNote:
                description: For the Solace team only; never published or shown to the specialist.
                type: string
                maxLength: 1000
    CancellationReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason:
                description: CancelSession's choices; optional.
                type: string
                enum: [TIME_NO_LONGER_WORKS, FEELING_BETTER, DIFFERENT_SPECIALIST, OTHER]
    Reschedule:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [holdId]
            properties:
              holdId:
                type: string
                format: uuid
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason:
                description: Shown to the applicant or specialist as written, in the reviewer's words.
                type: string
                minLength: 1
                maxLength: 1000
  responses:
    ApplicationReviewResponse:
      description: The application or record after the change
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApplicationReview"
    NotFound:
      description: No such application or specialist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is not valid; code says why (e.g. account.too-young)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed for this account
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Not possible in the current state; code says why (e.g. specialist.application-locked)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: The file is larger than allowed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      description: RFC 9457 problem details. title and detail are localised to the caller's language.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable error code, e.g. booking.slot-taken
        traceId:
          type: string
    PingResult:
      type: object
      additionalProperties: false
      required: [core, tracking, ai]
      properties:
        core:
          type: boolean
        tracking:
          type: boolean
          description: True when Tracking answered within the 2-second deadline.
        ai:
          type: boolean
          description: True when AI answered within the 2-second deadline.
    AppLanguage:
      description: The interface language. Not the session language.
      type: string
      enum: [en, fr]
    Phone:
      description: E.164, e.g. +237677000000
      type: string
      pattern: "^[+][1-9][0-9]{7,14}$"
    SignupRequest:
      type: object
      additionalProperties: false
      required: [displayName, phone, dateOfBirth, termsVersion, privacyNoticeVersion, appLanguage]
      properties:
        displayName:
          description: What the seeker wants to be called; only their specialist sees it.
          type: string
          minLength: 1
          maxLength: 60
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          type: string
          format: email
          maxLength: 254
        dateOfBirth:
          description: The seeker must be 18 or over.
          type: string
          format: date
        termsVersion:
          description: Version of the Terms the seeker agreed to.
          type: string
          maxLength: 40
        privacyNoticeVersion:
          description: Version of the privacy notice the seeker read.
          type: string
          maxLength: 40
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
    Me:
      type: object
      additionalProperties: false
      required: [id, role, displayName, appLanguage, onboarding]
      properties:
        id:
          description: Pseudonymous account id, also the subjectId of this person's events.
          type: string
          format: uuid
        role:
          type: string
          enum: [SEEKER, SPECIALIST]
        displayName:
          type: string
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
        onboarding:
          description: Which sign-up steps are done, so the app can resume.
          type: object
          additionalProperties: false
          required: [preferences, privacy]
          properties:
            preferences:
              type: boolean
            privacy:
              type: boolean
        applicationStatus:
          description: Specialists only. Where their application stands, so the app opens the right screen.
          allOf:
            - $ref: "#/components/schemas/ApplicationStatus"
    Preferences:
      type: object
      additionalProperties: false
      required: [appLanguage, sessionLanguages, helpTopics, specialistGender]
      properties:
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
        sessionLanguages:
          description: Codes from /v1/catalogue/session-languages; at least one.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        helpTopics:
          description: Codes from /v1/catalogue/help-topics; may be empty.
          type: array
          uniqueItems: true
          items:
            type: string
        specialistGender:
          type: string
          enum: [ANY, WOMAN, MAN]
    ConsentPurpose:
      description: |
        What a consent covers. Only purposes whose feature is offered in this release are accepted;
        in Phase 1 that is AI_ASSIST and AI_SCRIBE.
      type: string
      enum: [TRACKING, AI_ASSIST, SPECIALIST_SHARING, AI_SCRIBE, HEALTH_CHECK]
    ConsentChoices:
      type: object
      additionalProperties: false
      required: [choices]
      properties:
        choices:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [purpose, granted]
            properties:
              purpose:
                $ref: "#/components/schemas/ConsentPurpose"
              granted:
                type: boolean
    Consents:
      type: object
      additionalProperties: false
      required: [consents]
      properties:
        consents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [purpose, granted, version]
            properties:
              purpose:
                $ref: "#/components/schemas/ConsentPurpose"
              granted:
                description: False when never asked.
                type: boolean
              version:
                description: Version of the wording this choice was made on (or would be).
                type: string
              recordedAt:
                type: string
                format: date-time
    SessionLanguage:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          description: ISO 639 code, e.g. en, fr
          type: string
        name:
          type: string
    HelpTopic:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
    Profession:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
    SpecialistSignupRequest:
      type: object
      additionalProperties: false
      required: [fullName, phone, email, termsVersion, codeOfConductVersion, appLanguage]
      properties:
        fullName:
          description: Full name, as on the licence.
          type: string
          minLength: 1
          maxLength: 120
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          description: Professional email.
          type: string
          format: email
          maxLength: 254
        termsVersion:
          description: Version of the Specialist terms agreed to.
          type: string
          maxLength: 40
        codeOfConductVersion:
          description: Version of the Code of conduct agreed to.
          type: string
          maxLength: 40
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
    ApplicationStatus:
      description: |
        DRAFT → SUBMITTED → UNDER_REVIEW → APPROVED or REJECTED; APPROVED → SUSPENDED (System
        Design, Specialists). A change request returns the application to DRAFT with a reason.
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, SUSPENDED]
    Proficiency:
      type: string
      enum: [NATIVE, FLUENT, PROFESSIONAL]
    DocumentKind:
      type: string
      enum: [LICENCE, IDENTITY, PHOTO, CV]
    Modality:
      type: string
      enum: [AUDIO, VIDEO]
    PayoutMethod:
      type: string
      enum: [MTN_MOMO, ORANGE_MONEY, BANK_TRANSFER]
    Practice:
      type: object
      additionalProperties: false
      required: [profession, licenceNumber, yearsInPractice, licensingBody, focusAreas, bio]
