          $ref: "#/components/responses/Conflict"
  /admin/v1/health-check/versions/{versionId}/test-sets:
    parameters:
      - $ref: "#/components/parameters/HealthCheckVersionId"
    put:
      operationId: saveHealthCheckTestSets
      summary: Made-up answer sets to test the draft with; never real answers
      tags: [admin-health-check]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/HealthCheckTestSet"
      responses:
        "200":
          $ref: "#/components/responses/HealthCheckVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/health-check/versions/{versionId}/test-run:
    parameters:
      - $ref: "#/components/parameters/HealthCheckVersionId"
    post:
      operationId: testRunHealthCheck
      summary: Every test set against this version and the published one (admin screen 31)
      tags: [admin-health-check]
      responses:
        "200":
          description: One line per test set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthCheckTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/health-check/versions/{versionId}/submission:
    parameters:
      - $ref: "#/components/parameters/HealthCheckVersionId"
    post:
      operationId: submitHealthCheckVersion
      summary: Send a complete draft for review by a second Clinical reviewer
      tags: [admin-health-check]
      responses:
        "200":
          $ref: "#/components/responses/HealthCheckVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/health-check/versions/{versionId}/review:
    parameters:
      - $ref: "#/components/parameters/HealthCheckVersionId"
    post:
      operationId: reviewHealthCheckVersion
      summary: A Clinical reviewer who did not write it approves, or returns it with comments
      tags: [admin-health-check]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approve]
              properties:
                approve:
                  type: boolean
                comments:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          $ref: "#/components/responses/HealthCheckVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/health-check/versions/{versionId}/publication:
    parameters:
      - $ref: "#/components/parameters/HealthCheckVersionId"
    post:
      operationId: publishHealthCheckVersion
      summary: Publish an approved version; the old one retires and new responses use this one
      tags: [admin-health-check]
      responses:
        "200":
          $ref: "#/components/responses/HealthCheckVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/content/{contentId}/translation-draft:
    parameters:
      - name: contentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: draftContentTranslation
      summary: An AI draft of the other language of an item, for the editor to review; nothing is saved
      tags: [assist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from:
                  type: string
                  enum: [en, fr]
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  title:
                    type: string
                  body:
                    type: string
        "204":
          description: "No draft: the feature is off or the draft failed a check"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/specialist-applications/{id}/bio-draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: draftApplicationBio
      summary: An AI draft of the bio's missing language, for the reviewer to check and save (D30)
      tags: [assist]
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [language, text]
                properties:
                  language:
                    type: string
                  text:
                    type: string
        "204":
          description: "No draft: both languages exist, the feature is off, or the draft failed a check"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/specialist/bookings/{bookingId}/prep-note:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPrepNote
      summary: The specialist's private prep notes for a booking; each read is audited
      tags: [assist]
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepNote"
        "204":
          description: No note yet
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: savePrepNote
      summary: Save the prep notes; only the booking's specialist
      tags: [assist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepNote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/bookings/{bookingId}/scribe:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      operationId: getSessionScribe
      summary: Whether the scribe can record this session, and each person's choice
      description: |
        Audio is recorded only when both people consented to the scribe (AI_SCRIBE), neither refused
        for this session, and the scribe is switched on. Nothing is recorded by default.
      tags: [scribe]
      responses:
        "200":
          $ref: "#/components/responses/ScribeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setSessionScribe
      summary: The caller allows or refuses the scribe for this session only
      description: Refusing during a session stops the recording at once and deletes its audio.
      tags: [scribe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [on]
              properties:
                "on":
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/ScribeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/safety-plan:
    get:
      operationId: getSafetyPlan
      summary: The seeker's safety plan
      tags: [safety-plan]
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyPlan"
        "204":
          description: "No plan yet"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveSafetyPlan
      summary: Saves the seeker's safety plan
      tags: [safety-plan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyPlanEdit"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteSafetyPlan
      summary: Deletes the seeker's safety plan
      tags: [safety-plan]
      responses:
        "204":
          description: "Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/v1/insight/alerts:
    get:
      operationId: insightAlerts
      summary: Anomaly alerts of the last [14] days, newest first (admin screen 27; D58)
      description: Aggregates only. A booking drop or a spike in failed payments, checked every hour.
      tags: [admin-insight]
      responses:
        "200":
          description: The alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightAlert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token
  parameters:
    AdminBookingStatus:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/AdminBookingStatus"
    AdminBookingFrom:
      name: from
      in: query
      description: Starts at or after this moment.
      schema:
        type: string
        format: date-time
    AdminBookingTo:
      name: to
      in: query
      description: Starts before this moment.
      schema:
        type: string
        format: date-time
    AdminBookingLanguage:
      name: language
      in: query
      schema:
        type: string
    AdminBookingSpecialist:
      name: specialistId
      in: query
      schema:
        type: string
        format: uuid
    AdminBookingQuery:
      name: q
      in: query
      description: A booking reference (BK-7F9D1C2E), a full booking id or a longer prefix (D41).
      schema:
        type: string
        maxLength: 40
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuestToken:
      name: X-Guest-Token
      in: header
      required: true
      description: The token from createGuestBooking (D34).
      schema:
        type: string
    SpecialistId:
      name: id
      in: path
      required: true
      description: The specialist's account id.
      schema:
        type: string
        format: uuid
    SettingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9.-]*$"
        maxLength: 100
    StaffId:
      name: staffId
      in: path
      required: true
      description: The staff member's id in the staff realm.
      schema:
        type: string
        maxLength: 64
    AuditGroup:
      name: group
      in: query
      schema:
        type: string
        enum: [CONTACT_REVEALED, CRISIS_VIEWED, REFUND, STATUS_CHANGE, SETTING_CHANGE, BREAK_GLASS]
    AuditQuery:
      name: q
      in: query
      description: A staff member's name, or what the entry is on (a booking reference, a person reference).
      schema:
        type: string
        maxLength: 80
    AuditFrom:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    ContentSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
        maxLength: 60
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      description: An account id or a guest contact id.
      schema:
        type: string
        format: uuid
    AnalyticsPeriod:
      name: period
      in: query
      schema:
        type: string
        enum: [LAST_7_DAYS, LAST_30_DAYS, THIS_QUARTER]
        default: LAST_30_DAYS
    HealthCheckResponseId:
      name: responseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HealthCheckToken:
      name: X-Health-Check-Token
      in: header
      description: A guest's response token; seekers send their bearer token instead.
      schema:
        type: string
        maxLength: 100
    HealthCheckVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    Rating:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [stars]
            properties:
              stars:
                type: integer
                minimum: 1
                maximum: 5
              tags:
                description: What stood out.
                type: array
                maxItems: 4
                uniqueItems: true
                items:
                  type: string
                  enum: [LISTENED, PRACTICAL_TOOLS, CALL_QUALITY, ON_TIME]
              text:
                description: Shown on the profile, without the seeker's name, once published.
                type: string
                maxLength: 1000
              privateNote:
                description: For the Solace team only; never published or shown to the specialist.
                type: string
                maxLength: 1000
    CancellationReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason:
                description: CancelSession's choices; optional.
                type: string
                enum: [TIME_NO_LONGER_WORKS, FEELING_BETTER, DIFFERENT_SPECIALIST, OTHER]
    Reschedule:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [holdId]
            properties:
              holdId:
                type: string
                format: uuid
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason:
                description: Shown to the applicant or specialist as written, in the reviewer's words.
                type: string
                minLength: 1
                maxLength: 1000
  responses:
    ScribeResponse:
      description: The scribe for this session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionScribe"
    HealthCheckVersionResponse:
      description: The version after the change
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthCheckVersion"
    ApplicationReviewResponse:
      description: The application or record after the change
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApplicationReview"
    NotFound:
      description: No such application or specialist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is not valid; code says why (e.g. account.too-young)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed for this account
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Not possible in the current state; code says why (e.g. specialist.application-locked)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: The file is larger than allowed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      description: RFC 9457 problem details. title and detail are localised to the caller's language.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable error code, e.g. booking.slot-taken
        traceId:
          type: string
    PingResult:
      type: object
      additionalProperties: false
      required: [core, tracking, ai]
      properties:
        core:
          type: boolean
        tracking:
          type: boolean
          description: True when Tracking answered within the 2-second deadline.
        ai:
          type: boolean
          description: True when AI answered within the 2-second deadline.
    AppLanguage:
      description: The interface language. Not the session language.
      type: string
      enum: [en, fr]
    Phone:
      description: E.164, e.g. +237677000000
      type: string
      pattern: "^[+][1-9][0-9]{7,14}$"
    SignupRequest:
      type: object
      additionalProperties: false
      required: [displayName, phone, dateOfBirth, termsVersion, privacyNoticeVersion, appLanguage]
      properties:
        displayName:
          description: What the seeker wants to be called; only their specialist sees it.
          type: string
          minLength: 1
          maxLength: 60
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          type: string
          format: email
          maxLength: 254
        dateOfBirth:
          description: The seeker must be 18 or over.
          type: string
          format: date
        termsVersion:
          description: Version of the Terms the seeker agreed to.
          type: string
          maxLength: 40
        privacyNoticeVersion:
          description: Version of the privacy notice the seeker read.
          type: string
          maxLength: 40
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
    Me:
      type: object
      additionalProperties: false
      required: [id, role, displayName, appLanguage, onboarding]
      properties:
        id:
          description: Pseudonymous account id, also the subjectId of this person's events.
          type: string
          format: uuid
        role:
          type: string
          enum: [SEEKER, SPECIALIST]
        displayName:
          type: string
        phone:
          description: The person's own number, shown on their You tab.
          type: string
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
        onboarding:
          description: Which sign-up steps are done, so the app can resume.
          type: object
          additionalProperties: false
          required: [preferences, privacy]
          properties:
            preferences:
              type: boolean
            privacy:
              type: boolean
        applicationStatus:
          description: Specialists only. Where their application stands, so the app opens the right screen.
          allOf:
            - $ref: "#/components/schemas/ApplicationStatus"
        legalToAccept:
          description: Seekers only. Legal texts with a newer published version than the one accepted; the app asks before going on (D44).
          type: array
          items:
            $ref: "#/components/schemas/LegalAcceptance"
    Preferences:
      type: object
      additionalProperties: false
      required: [appLanguage, sessionLanguages, helpTopics, specialistGender]
      properties:
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
        sessionLanguages:
          description: Codes from /v1/catalogue/session-languages; at least one.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        helpTopics:
          description: Codes from /v1/catalogue/help-topics; may be empty.
          type: array
          uniqueItems: true
          items:
            type: string
        specialistGender:
          type: string
          enum: [ANY, WOMAN, MAN]
    ConsentPurpose:
      description: |
        What a consent covers. Only purposes whose feature is offered in this release are accepted;
        in Phase 1 that is AI_ASSIST and AI_SCRIBE.
      type: string
      enum: [TRACKING, AI_ASSIST, SPECIALIST_SHARING, AI_SCRIBE, HEALTH_CHECK]
    ConsentChoices:
      type: object
      additionalProperties: false
      required: [choices]
      properties:
        choices:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [purpose, granted]
            properties:
              purpose:
                $ref: "#/components/schemas/ConsentPurpose"
              granted:
                type: boolean
    Consents:
      type: object
      additionalProperties: false
      required: [consents]
      properties:
        consents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [purpose, granted, version]
            properties:
              purpose:
                $ref: "#/components/schemas/ConsentPurpose"
              granted:
                description: False when never asked.
                type: boolean
              version:
                description: Version of the wording this choice was made on (or would be).
                type: string
              recordedAt:
                type: string
                format: date-time
    SessionLanguage:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          description: ISO 639 code, e.g. en, fr
          type: string
        name:
          type: string
    HelpTopic:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
    Profession:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
    SpecialistSignupRequest:
      type: object
      additionalProperties: false
      required: [fullName, phone, email, termsVersion, codeOfConductVersion, appLanguage]
      properties:
        fullName:
          description: Full name, as on the licence.
          type: string
          minLength: 1
          maxLength: 120
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          description: Professional email.
          type: string
          format: email
          maxLength: 254
        termsVersion:
          description: Version of the Specialist terms agreed to.
          type: string
          maxLength: 40
        codeOfConductVersion:
          description: Version of the Code of conduct agreed to.
          type: string
          maxLength: 40
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
    ApplicationStatus:
      description: |
        DRAFT → SUBMITTED → UNDER_REVIEW → APPROVED or REJECTED; APPROVED → SUSPENDED (System
        Design, Specialists). A change request returns the application to DRAFT with a reason.
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, SUSPENDED]
    Proficiency:
      type: string
      enum: [NATIVE, FLUENT, PROFESSIONAL]
    DocumentKind:
      type: string
      enum: [LICENCE, IDENTITY, PHOTO, CV]
    AdminBookingStatus:
      description: A booking status as staff filter it; DISPUTED while a dispute or flag is open (D41).
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW, EXPIRED, DISPUTED]
    DisputeOutcome:
      type: string
      enum: [SPECIALIST_NO_SHOW, SEEKER_NO_SHOW, CONNECTION_PROBLEM]
    AdminBookingRow:
      type: object
      additionalProperties: false
      required: [id, reference, startsAt, endsAt, specialist, personRef, modality, sessionLanguage, price, status, disputed]
      properties:
        id:
          type: string
          format: uuid
        reference:
          description: BK- and the first eight characters of the id.
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        specialist:
          type: object
          additionalProperties: false
