        verifiedItems:
          description: How many of the six items are verified; approval needs all six.
          type: integer
        identity:
          type: object
          additionalProperties: false
          properties:
            verification:
              $ref: "#/components/schemas/Verification"
        licence:
          type: object
          additionalProperties: false
          properties:
            licenceNumber:
              type: string
            licensingBody:
              type: string
            yearsInPractice:
              type: integer
            validUntil:
              type: string
              format: date
            verification:
              $ref: "#/components/schemas/Verification"
        languages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, declared]
            properties:
              code:
                type: string
              declared:
                $ref: "#/components/schemas/Proficiency"
              verifiedLevel:
                $ref: "#/components/schemas/VerifiedLevel"
              verification:
                $ref: "#/components/schemas/Verification"
        services:
          type: object
          additionalProperties: false
          required: [offerings, withinBands]
          properties:
            offerings:
              type: array
              items:
                $ref: "#/components/schemas/Offering"
            withinBands:
              type: boolean
        profile:
          type: object
          additionalProperties: false
          properties:
            focusAreas:
              type: array
              items:
                type: string
            bioEn:
              type: string
            bioFr:
              type: string
            draftedLanguage:
              description: The bio language Solace drafted (D30); the specialist checks it before the profile goes live.
              $ref: "#/components/schemas/AppLanguage"
            verification:
              $ref: "#/components/schemas/Verification"
        payout:
          type: object
          additionalProperties: false
          properties:
            method:
              $ref: "#/components/schemas/PayoutMethod"
            phone:
              description: Masked.
              type: string
            holderName:
              type: string
            verification:
              $ref: "#/components/schemas/Verification"
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, fileName, contentType, size, uploadedAt]
            properties:
              id:
                type: string
                format: uuid
              kind:
                $ref: "#/components/schemas/DocumentKind"
              fileName:
                type: string
              contentType:
                type: string
              size:
                type: integer
              uploadedAt:
                type: string
                format: date-time
        notes:
          description: Reviewer notes, staff only.
          type: string
        activity:
          description: Newest first.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [at, kind]
            properties:
              at:
                type: string
                format: date-time
              kind:
                description: The portal words each kind in the viewer's language. The list grows as review steps are added, so clients show unknown kinds plainly.
                type: string
                x-extensible-enum: [SUBMITTED, OPENED, ITEM_VERIFIED, ITEM_UNVERIFIED, LANGUAGE_VERIFIED, BIO_ADDED, INTERVIEW_BOOKED, CHANGES_REQUESTED, APPROVAL_PROPOSED, APPROVAL_WITHDRAWN, APPROVED, REJECTED, SUSPENDED, REINSTATED]
              subject:
                description: The item or language code the entry is about, if any.
                type: string
              value:
                description: The level verified, if any.
                type: string
              by:
                $ref: "#/components/schemas/StaffRef"
