              anyOf:
                type: array
                items:
                  type: string
              screener:
                type: string
                enum: [PHQ9, GAD7]
              atLeast:
                description: A screener total at least this.
                type: integer
                minimum: 0
              atMost:
                description: A screener total at most this.
                type: integer
                minimum: 0
        specialty:
          type: string
        points:
          type: integer
          minimum: 1
          maximum: 10
        reasonEn:
          type: string
          maxLength: 200
        reasonFr:
          type: string
          maxLength: 200
