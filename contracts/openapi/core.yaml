openapi: 3.1.0
info:
  title: Solace Core API
  version: 0.1.0
  description: |
    Core: identity, marketplace, money, admin, health check.
    Reached through the gateway at /api/core. Phase 0 stub; endpoints are added with each epic.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/core
    description: Through the gateway (http://localhost:8080 locally)
security:
  - bearerAuth: []
tags:
  - name: system
    description: Platform plumbing, no user data
  - name: accounts
    description: Seeker sign-up and the signed-in person's own account (Phase 1, epic 1)
  - name: privacy
    description: Consent choices (Phase 1, epic 11)
  - name: specialists
    description: Specialist sign-up and application (Phase 1, epic 2)
  - name: scheduling
    description: A specialist's weekly hours (Phase 1, epics 2 and 4)
  - name: admin-specialists
    description: Staff review of specialist applications and specialist records (Phase 1, epic 2). Staff realm only; the permission matrix (contracts/permissions) decides who may view or change.
  - name: bookings
    description: Bookings, cancellation and rescheduling (Phase 1, epic 5)
  - name: guests
    description: Guest bookings without an account (D34); the guest token goes in X-Guest-Token
  - name: payments
    description: Paying for a booking, the aggregator's webhooks and specialist earnings (Phase 1, epic 6)
  - name: admin-payments
    description: Transactions, refunds and payout runs for staff (Phase 1, epic 6). Two people for every refund and payout run (D14, D35).
  - name: admin-bookings
    description: Bookings, attendance and disputes for staff (admin screens 7 and 8; D41).
  - name: sessions
    description: Joining a session's room and attendance from the media server (Phase 1, epic 7)
  - name: reviews
    description: Ratings and reviews (Phase 1, epic 8)
  - name: admin-reviews
    description: Review moderation for staff (Phase 1, epic 8)
  - name: notifications
    description: Push devices, notification settings and the in-app inbox (Phase 1, epic 9)
  - name: admin-crisis
    description: The crisis queue and the on-call rota (Phase 1, epic 10; D11, D15, D39)
  - name: catalogue
    description: Reference data shown before sign-in, in the caller's language
  - name: config
    description: Feature flags the apps read at start (D42)
  - name: admin-settings
    description: Platform settings and feature flags for staff (admin screen 20; D42). Every change needs a reason and creates a new version.
  - name: admin-team
    description: Staff accounts and their roles (admin screen 19; D7, D42). Super admins only.
  - name: admin-audit
    description: The append-only audit log (admin screen 18; D42)
  - name: admin-catalogue
    description: Specialties, session languages, help topics and cancellation policy versions (admin screen 14; D43)
  - name: content
    description: Published articles, FAQs, crisis resources and legal text for the apps (D44)
  - name: admin-content
    description: Writing, translating, checking and publishing content (admin screens 15 and 16; D44)
  - name: admin-people
    description: Seekers, specialists' accounts and guests, their consents and data requests (admin screens 9 and 10; D45)
  - name: admin-insight
    description: The live overview and aggregated analytics (admin screens 2 and 17; D46). Counts only, never people.
  - name: admin-push
    description: Browser notifications for staff (D38, D47)
  - name: invites
    description: Invitations from tracking with matched specialists (D52)
  - name: health-check
    description: The health check for seekers and guests (System Design, Health check; D55). No AI reads the answers
  - name: admin-health-check
    description: Writing, testing and approving health check versions (admin screens 28 to 31; D55)
  - name: assist
    description: AI drafts a person reviews before anything is published, and the specialist's prep notes (Phase 3; D56)
  - name: scribe
    description: The session scribe's consent for one session (Phase 4; D57)
  - name: safety-plan
    description: The seeker's safety plan (SafetyPlan.dc.html; Phase 4; D57)
paths:
  /v1/signups:
    post:
      operationId: startSignup
      summary: Start a seeker account
      description: |
        Creates the account, unverified, and lets the app ask Keycloak for a sign-in code to the
        phone number. The account becomes active at the first sign-in with that code.
        The answer is the same whether or not the phone number already has an account, so nobody
        can find out which numbers do; an active account is never changed by this call. An
        unverified account with the same number is replaced.
      tags: [accounts]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Ask Keycloak for a code next
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in person's account
      description: The first call after a sign-in also activates an unverified account and moves any guest bookings made with the same verified contact into it.
      tags: [accounts]
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/preferences:
    get:
      operationId: getPreferences
      summary: App language, session languages, help topics and specialist preference
      tags: [accounts]
      responses:
        "200":
          description: Current preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: savePreferences
      summary: Save preferences (sign-up step 2, and later from Settings)
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/consents:
    get:
      operationId: getConsents
      summary: Current consent choice per purpose
      description: Only the purposes offered in this release are listed; each carries the version of the wording.
      tags: [privacy]
      responses:
        "200":
          description: Current choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consents"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveConsents
      summary: Record consent choices (sign-up step 3, and later from Privacy & data)
      description: Every change is appended to the person's consent history; nothing is overwritten.
      tags: [privacy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentChoices"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consents"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/catalogue/session-languages:
    get:
      operationId: listSessionLanguages
      summary: Languages a session can be held in
      description: Data, not a fixed list (D16). Names are in the caller's language (Accept-Language).
      tags: [catalogue]
      security: []
      responses:
        "200":
          description: Enabled languages in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionLanguage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/catalogue/help-topics:
    get:
      operationId: listHelpTopics
      summary: Topics a seeker can ask for help with
      description: Labels are in the caller's language (Accept-Language).
      tags: [catalogue]
      security: []
      responses:
        "200":
          description: Enabled topics in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpTopic"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/specialist-signups:
    post:
      operationId: startSpecialistSignup
      summary: Start a specialist application (SpecSignup, step 1 of 7)
      description: |
        Creates an unverified specialist account and a DRAFT application, then the app asks Keycloak
        for a code to the phone number, exactly as for seekers (D24: no password). Core answers 202
        whether or not the number already has an account, so this cannot be used to find out who
        uses Solace.
      tags: [specialists]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistSignupRequest"
      responses:
        "202":
          description: Ask Keycloak for a code next
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me/specialist-application:
    get:
      operationId: getSpecialistApplication
      summary: The signed-in specialist's application, to resume or to follow the review
      tags: [specialists]
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/specialist-application/practice:
    put:
      operationId: savePractice
      summary: Your practice (SpecProfessional, step 2 of 7)
      tags: [specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Practice"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/specialist-application/languages:
    put:
      operationId: saveSpecialistLanguages
      summary: Languages you counsel in (SpecLanguages, step 3 of 7)
      description: Declared levels; reviewers confirm each one in the onboarding interview. Only PROFESSIONAL and above become bookable.
      tags: [specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistLanguages"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/specialist-application/documents/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/DocumentKind"
    put:
      operationId: uploadSpecialistDocument
      summary: Add or replace a document (SpecDocuments, step 4 of 7)
      description: |
        Replaces every file of this kind. One file per kind, except IDENTITY, which takes up to two
        (front and back). PDF, JPEG or PNG; PHOTO must be an image. Files are encrypted in object
        storage and only the verification team can open them; each opening is audited.
      tags: [specialists]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/me/specialist-application/services:
    put:
      operationId: saveSpecialistServices
      summary: Sessions you offer (SpecServices, step 5 of 7)
      tags: [specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistServices"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/specialist-application/payout:
    put:
      operationId: saveSpecialistPayout
      summary: How should we pay you? (SpecPayout, step 7 of 7)
      description: BANK_TRANSFER is refused while the payout-bank-transfer flag is off (D26).
      tags: [specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutDetails"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/specialist-application/submission:
    post:
      operationId: submitSpecialistApplication
      summary: Submit the application for review
      description: Every step must be complete. The application moves from DRAFT to SUBMITTED and can no longer be edited unless a reviewer asks for changes.
      tags: [specialists]
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/weekly-hours:
    get:
      operationId: getWeeklyHours
      summary: The specialist's weekly hours
      tags: [scheduling]
      responses:
        "200":
          description: The weekly hours; empty days when none are set yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyHours"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: saveWeeklyHours
      summary: Your weekly hours (SpecAvailability, step 6 of 7; later Calendar & availability)
      description: Times are local to timeZone. Ranges on a day must not overlap.
      tags: [scheduling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyHours"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyHours"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/catalogue/professions:
    get:
      operationId: listProfessions
      summary: Professions a specialist can apply as
      description: Data, not a fixed list (D26). Labels are in the caller's language (Accept-Language).
      tags: [catalogue]
      security: []
      responses:
        "200":
          description: Enabled professions in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profession"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/v1/specialist-applications:
    get:
      operationId: listSpecialistApplications
      summary: Specialist applications, oldest first (admin screen 4)
      description: Staff with view access to Specialists. Counts are per tab.
      tags: [admin-specialists]
      parameters:
        - name: tab
          in: query
          required: true
          schema:
            type: string
            enum: [SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, DECIDED]
        - name: profession
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The tab's applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/specialist-applications/{id}:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    get:
      operationId: getApplicationReview
      summary: One application with its six review items (admin screen 5)
      tags: [admin-specialists]
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/specialist-applications/{id}/review:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    post:
      operationId: openApplicationForReview
      summary: Open a submitted application for review and take it
      description: SUBMITTED to UNDER_REVIEW, assigned to the caller. On an application already under review, assigns it to the caller.
      tags: [admin-specialists]
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/items/{item}:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
      - name: item
        in: path
        required: true
        schema:
          type: string
          enum: [IDENTITY, LICENCE, PROFILE, PAYOUT]
    put:
      operationId: verifyApplicationItem
      summary: Mark an item verified, or not
      description: |
        Languages are verified one by one, and services follow from the price bands, so neither is
        set here. PROFILE needs the bio in both EN and FR. LICENCE takes the licence's expiry date.
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemVerification"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/languages/{code}:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
      - name: code
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: verifyApplicationLanguage
      summary: Record the level confirmed in the onboarding interview
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verifiedLevel]
              properties:
                verifiedLevel:
                  $ref: "#/components/schemas/VerifiedLevel"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/bio:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    put:
      operationId: saveApplicationBio
      summary: Add or correct the bio in one language
      description: Nothing seekers see is published without both EN and FR. Until the AI draft arrives (Phase 3), the reviewer writes the missing language.
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language, text]
              properties:
                language:
                  $ref: "#/components/schemas/AppLanguage"
                text:
                  type: string
                  minLength: 1
                  maxLength: 600
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    put:
      operationId: saveReviewerNotes
      summary: Reviewer notes, visible to staff only
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notes]
              properties:
                notes:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/specialist-applications/{id}/interview:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    put:
      operationId: bookInterview
      summary: Book the onboarding interview (D25)
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [at]
              properties:
                at:
                  type: string
                  format: date-time
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/change-request:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    post:
      operationId: requestApplicationChanges
      summary: Send the application back to the applicant with a reason they see in the app
      tags: [admin-specialists]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/approval-proposal:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    post:
      operationId: proposeApproval
      summary: Propose approval once every item is verified (D29, first of two people)
      tags: [admin-specialists]
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: withdrawApprovalProposal
      summary: Withdraw or decline a proposed approval; the application goes back to review
      tags: [admin-specialists]
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
