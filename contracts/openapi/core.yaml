      parameters:
        - $ref: "#/components/parameters/AuditGroup"
        - $ref: "#/components/parameters/AuditQuery"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - name: before
          in: query
          description: Entries older than this entry id, for the next page.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Up to 100 entries
          content:
            application/json:
              schema:
                type: array
