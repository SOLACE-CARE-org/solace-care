openapi: 3.1.0
info:
  title: Solace Core API
  version: 0.1.0
  description: |
    Core: identity, marketplace, money, admin, health check.
    Reached through the gateway at /api/core. Phase 0 stub; endpoints are added with each epic.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/core
    description: Through the gateway (http://localhost:8080 locally)
security:
  - bearerAuth: []
tags:
  - name: system
    description: Platform plumbing, no user data
  - name: accounts
    description: Seeker sign-up and the signed-in person's own account (Phase 1, epic 1)
  - name: privacy
    description: Consent choices (Phase 1, epic 11)
  - name: specialists
    description: Specialist sign-up and application (Phase 1, epic 2)
  - name: scheduling
    description: A specialist's weekly hours (Phase 1, epics 2 and 4)
  - name: admin-specialists
    description: Staff review of specialist applications and specialist records (Phase 1, epic 2). Staff realm only; the permission matrix (contracts/permissions) decides who may view or change.
  - name: catalogue
    description: Reference data shown before sign-in, in the caller's language
paths:
  /v1/signups:
    post:
      operationId: startSignup
      summary: Start a seeker account
      description: |
        Creates the account, unverified, and lets the app ask Keycloak for a sign-in code to the
        phone number. The account becomes active at the first sign-in with that code.
        The answer is the same whether or not the phone number already has an account, so nobody
        can find out which numbers do; an active account is never changed by this call. An
        unverified account with the same number is replaced.
      tags: [accounts]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Ask Keycloak for a code next
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in person's account
      description: The first call after a sign-in also activates an unverified account and moves any guest bookings made with the same verified contact into it.
      tags: [accounts]
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/preferences:
    get:
      operationId: getPreferences
      summary: App language, session languages, help topics and specialist preference
      tags: [accounts]
      responses:
        "200":
          description: Current preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: savePreferences
      summary: Save preferences (sign-up step 2, and later from Settings)
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/consents:
    get:
      operationId: getConsents
      summary: Current consent choice per purpose
      description: Only the purposes offered in this release are listed; each carries the version of the wording.
      tags: [privacy]
      responses:
        "200":
          description: Current choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consents"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveConsents
      summary: Record consent choices (sign-up step 3, and later from Privacy & data)
      description: Every change is appended to the person's consent history; nothing is overwritten.
      tags: [privacy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentChoices"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consents"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/catalogue/session-languages:
    get:
      operationId: listSessionLanguages
      summary: Languages a session can be held in
      description: Data, not a fixed list (D16). Names are in the caller's language (Accept-Language).
      tags: [catalogue]
      security: []
      responses:
        "200":
          description: Enabled languages in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionLanguage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/catalogue/help-topics:
    get:
      operationId: listHelpTopics
      summary: Topics a seeker can ask for help with
      description: Labels are in the caller's language (Accept-Language).
      tags: [catalogue]
      security: []
      responses:
        "200":
          description: Enabled topics in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpTopic"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/specialist-signups:
    post:
      operationId: startSpecialistSignup
      summary: Start a specialist application (SpecSignup, step 1 of 7)
      description: |
        Creates an unverified specialist account and a DRAFT application, then the app asks Keycloak
        for a code to the phone number, exactly as for seekers (D24: no password). Core answers 202
        whether or not the number already has an account, so this cannot be used to find out who
        uses Solace.
      tags: [specialists]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistSignupRequest"
      responses:
        "202":
          description: Ask Keycloak for a code next
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me/specialist-application:
    get:
      operationId: getSpecialistApplication
      summary: The signed-in specialist's application, to resume or to follow the review
      tags: [specialists]
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/specialist-application/practice:
    put:
      operationId: savePractice
      summary: Your practice (SpecProfessional, step 2 of 7)
      tags: [specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Practice"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/specialist-application/languages:
    put:
      operationId: saveSpecialistLanguages
      summary: Languages you counsel in (SpecLanguages, step 3 of 7)
      description: Declared levels; reviewers confirm each one in the onboarding interview. Only PROFESSIONAL and above become bookable.
      tags: [specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistLanguages"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/specialist-application/documents/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/DocumentKind"
    put:
      operationId: uploadSpecialistDocument
      summary: Add or replace a document (SpecDocuments, step 4 of 7)
      description: |
        Replaces every file of this kind. One file per kind, except IDENTITY, which takes up to two
        (front and back). PDF, JPEG or PNG; PHOTO must be an image. Files are encrypted in object
        storage and only the verification team can open them; each opening is audited.
      tags: [specialists]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/me/specialist-application/services:
    put:
      operationId: saveSpecialistServices
      summary: Sessions you offer (SpecServices, step 5 of 7)
      tags: [specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistServices"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/specialist-application/payout:
    put:
      operationId: saveSpecialistPayout
      summary: How should we pay you? (SpecPayout, step 7 of 7)
      description: BANK_TRANSFER is refused while the payout-bank-transfer flag is off (D26).
      tags: [specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutDetails"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/specialist-application/submission:
    post:
      operationId: submitSpecialistApplication
      summary: Submit the application for review
      description: Every step must be complete. The application moves from DRAFT to SUBMITTED and can no longer be edited unless a reviewer asks for changes.
      tags: [specialists]
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/weekly-hours:
    get:
      operationId: getWeeklyHours
      summary: The specialist's weekly hours
      tags: [scheduling]
      responses:
        "200":
          description: The weekly hours; empty days when none are set yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyHours"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: saveWeeklyHours
      summary: Your weekly hours (SpecAvailability, step 6 of 7; later Calendar & availability)
      description: Times are local to timeZone. Ranges on a day must not overlap.
      tags: [scheduling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyHours"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyHours"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/catalogue/professions:
    get:
      operationId: listProfessions
      summary: Professions a specialist can apply as
      description: Data, not a fixed list (D26). Labels are in the caller's language (Accept-Language).
      tags: [catalogue]
      security: []
      responses:
        "200":
          description: Enabled professions in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profession"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/v1/specialist-applications:
    get:
      operationId: listSpecialistApplications
      summary: Specialist applications, oldest first (admin screen 4)
      description: Staff with view access to Specialists. Counts are per tab.
      tags: [admin-specialists]
      parameters:
        - name: tab
          in: query
          required: true
          schema:
            type: string
            enum: [SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, DECIDED]
        - name: profession
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The tab's applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/specialist-applications/{id}:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    get:
      operationId: getApplicationReview
      summary: One application with its six review items (admin screen 5)
      tags: [admin-specialists]
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/specialist-applications/{id}/review:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    post:
      operationId: openApplicationForReview
      summary: Open a submitted application for review and take it
      description: SUBMITTED to UNDER_REVIEW, assigned to the caller. On an application already under review, assigns it to the caller.
      tags: [admin-specialists]
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/items/{item}:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
      - name: item
        in: path
        required: true
        schema:
          type: string
          enum: [IDENTITY, LICENCE, PROFILE, PAYOUT]
    put:
      operationId: verifyApplicationItem
      summary: Mark an item verified, or not
      description: |
        Languages are verified one by one, and services follow from the price bands, so neither is
        set here. PROFILE needs the bio in both EN and FR. LICENCE takes the licence's expiry date.
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemVerification"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/languages/{code}:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
      - name: code
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: verifyApplicationLanguage
      summary: Record the level confirmed in the onboarding interview
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verifiedLevel]
              properties:
                verifiedLevel:
                  $ref: "#/components/schemas/VerifiedLevel"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/bio:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    put:
      operationId: saveApplicationBio
      summary: Add or correct the bio in one language
      description: Nothing seekers see is published without both EN and FR. Until the AI draft arrives (Phase 3), the reviewer writes the missing language.
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language, text]
              properties:
                language:
                  $ref: "#/components/schemas/AppLanguage"
                text:
                  type: string
                  minLength: 1
                  maxLength: 600
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    put:
      operationId: saveReviewerNotes
      summary: Reviewer notes, visible to staff only
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notes]
              properties:
                notes:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/specialist-applications/{id}/interview:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    put:
      operationId: bookInterview
      summary: Book the onboarding interview (D25)
      tags: [admin-specialists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [at]
              properties:
                at:
                  type: string
                  format: date-time
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/change-request:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    post:
      operationId: requestApplicationChanges
      summary: Send the application back to the applicant with a reason they see in the app
      tags: [admin-specialists]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/approval-proposal:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    post:
      operationId: proposeApproval
      summary: Propose approval once every item is verified (D29, first of two people)
      tags: [admin-specialists]
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: withdrawApprovalProposal
      summary: Withdraw or decline a proposed approval; the application goes back to review
      tags: [admin-specialists]
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/approval:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    post:
      operationId: approveApplication
      summary: Confirm a proposed approval (D29, second of two people)
      description: Only someone other than the proposer may confirm. Every item must still be verified.
      tags: [admin-specialists]
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/rejection:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    post:
      operationId: rejectApplication
      summary: Reject, with a reason the applicant sees in the app
      tags: [admin-specialists]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/v1/specialist-applications/{id}/documents/{fileId}:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: openSpecialistDocument
      summary: Open one credential document
      description: Only staff with view access to Specialists. Every opening is written to the audit log first.
      tags: [admin-specialists]
      responses:
        "200":
          description: The file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/specialists:
    get:
      operationId: findSpecialists
      summary: Find an approved or suspended specialist by name or licence number (admin screen 6)
      tags: [admin-specialists]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        "200":
          description: Up to 20 matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialistSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/v1/specialists/{id}:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    get:
      operationId: getSpecialistRecord
      summary: An approved or suspended specialist's record
      tags: [admin-specialists]
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/v1/specialists/{id}/suspension:
    parameters:
      - $ref: "#/components/parameters/SpecialistId"
    post:
      operationId: suspendSpecialist
      summary: Suspend an approved specialist; they stop taking bookings
      tags: [admin-specialists]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: reinstateSpecialist
      summary: Reinstate a suspended specialist (Super admin only, D26)
      tags: [admin-specialists]
      responses:
        "200":
          $ref: "#/components/responses/ApplicationReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/system/ping:
    get:
      operationId: ping
      summary: Phase 0 end-to-end slice
      description: Core calls Tracking and AI over gRPC, publishes core.system.pinged through the outbox, and reports which services answered.
      tags: [system]
      responses:
        "200":
          description: Result of the ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token
  parameters:
    SpecialistId:
      name: id
      in: path
      required: true
      description: The specialist's account id.
      schema:
        type: string
        format: uuid
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason:
                description: Shown to the applicant or specialist as written, in the reviewer's words.
                type: string
                minLength: 1
                maxLength: 1000
  responses:
    ApplicationReviewResponse:
      description: The application or record after the change
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApplicationReview"
    NotFound:
      description: No such application or specialist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is not valid; code says why (e.g. account.too-young)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not allowed for this account
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Not possible in the current state; code says why (e.g. specialist.application-locked)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: The file is larger than allowed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      description: RFC 9457 problem details. title and detail are localised to the caller's language.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable error code, e.g. booking.slot-taken
        traceId:
          type: string
    PingResult:
      type: object
      additionalProperties: false
      required: [core, tracking, ai]
      properties:
        core:
          type: boolean
        tracking:
          type: boolean
          description: True when Tracking answered within the 2-second deadline.
        ai:
          type: boolean
          description: True when AI answered within the 2-second deadline.
    AppLanguage:
      description: The interface language. Not the session language.
      type: string
      enum: [en, fr]
    Phone:
      description: E.164, e.g. +237677000000
      type: string
      pattern: "^[+][1-9][0-9]{7,14}$"
    SignupRequest:
      type: object
      additionalProperties: false
      required: [displayName, phone, dateOfBirth, termsVersion, privacyNoticeVersion, appLanguage]
      properties:
        displayName:
          description: What the seeker wants to be called; only their specialist sees it.
          type: string
          minLength: 1
          maxLength: 60
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          type: string
          format: email
          maxLength: 254
        dateOfBirth:
          description: The seeker must be 18 or over.
          type: string
          format: date
        termsVersion:
          description: Version of the Terms the seeker agreed to.
          type: string
          maxLength: 40
        privacyNoticeVersion:
          description: Version of the privacy notice the seeker read.
          type: string
          maxLength: 40
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
    Me:
      type: object
      additionalProperties: false
      required: [id, role, displayName, appLanguage, onboarding]
      properties:
        id:
          description: Pseudonymous account id, also the subjectId of this person's events.
          type: string
          format: uuid
        role:
          type: string
          enum: [SEEKER, SPECIALIST]
        displayName:
          type: string
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
        onboarding:
          description: Which sign-up steps are done, so the app can resume.
          type: object
          additionalProperties: false
          required: [preferences, privacy]
          properties:
            preferences:
              type: boolean
            privacy:
              type: boolean
        applicationStatus:
          description: Specialists only. Where their application stands, so the app opens the right screen.
          allOf:
            - $ref: "#/components/schemas/ApplicationStatus"
    Preferences:
      type: object
      additionalProperties: false
      required: [appLanguage, sessionLanguages, helpTopics, specialistGender]
      properties:
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
        sessionLanguages:
          description: Codes from /v1/catalogue/session-languages; at least one.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        helpTopics:
          description: Codes from /v1/catalogue/help-topics; may be empty.
          type: array
          uniqueItems: true
          items:
            type: string
        specialistGender:
          type: string
          enum: [ANY, WOMAN, MAN]
    ConsentPurpose:
      description: |
        What a consent covers. Only purposes whose feature is offered in this release are accepted;
        in Phase 1 that is AI_ASSIST and AI_SCRIBE.
      type: string
      enum: [TRACKING, AI_ASSIST, SPECIALIST_SHARING, AI_SCRIBE, HEALTH_CHECK]
    ConsentChoices:
      type: object
      additionalProperties: false
      required: [choices]
      properties:
        choices:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [purpose, granted]
            properties:
              purpose:
                $ref: "#/components/schemas/ConsentPurpose"
              granted:
                type: boolean
    Consents:
      type: object
      additionalProperties: false
      required: [consents]
      properties:
        consents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [purpose, granted, version]
            properties:
              purpose:
                $ref: "#/components/schemas/ConsentPurpose"
              granted:
                description: False when never asked.
                type: boolean
              version:
                description: Version of the wording this choice was made on (or would be).
                type: string
              recordedAt:
                type: string
                format: date-time
    SessionLanguage:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          description: ISO 639 code, e.g. en, fr
          type: string
        name:
          type: string
    HelpTopic:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
    Profession:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
    SpecialistSignupRequest:
      type: object
      additionalProperties: false
      required: [fullName, phone, email, termsVersion, codeOfConductVersion, appLanguage]
      properties:
        fullName:
          description: Full name, as on the licence.
          type: string
          minLength: 1
          maxLength: 120
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          description: Professional email.
          type: string
          format: email
          maxLength: 254
        termsVersion:
          description: Version of the Specialist terms agreed to.
          type: string
          maxLength: 40
        codeOfConductVersion:
          description: Version of the Code of conduct agreed to.
          type: string
          maxLength: 40
        appLanguage:
          $ref: "#/components/schemas/AppLanguage"
    ApplicationStatus:
      description: |
        DRAFT → SUBMITTED → UNDER_REVIEW → APPROVED or REJECTED; APPROVED → SUSPENDED (System
        Design, Specialists). A change request returns the application to DRAFT with a reason.
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, SUSPENDED]
    Proficiency:
      type: string
      enum: [NATIVE, FLUENT, PROFESSIONAL]
    DocumentKind:
      type: string
      enum: [LICENCE, IDENTITY, PHOTO, CV]
    Modality:
      type: string
      enum: [AUDIO, VIDEO]
    PayoutMethod:
      type: string
      enum: [MTN_MOMO, ORANGE_MONEY, BANK_TRANSFER]
    Practice:
      type: object
      additionalProperties: false
      required: [profession, licenceNumber, yearsInPractice, licensingBody, focusAreas, bio]
      properties:
        profession:
          description: A code from /v1/catalogue/professions.
          type: string
        licenceNumber:
          type: string
          minLength: 1
          maxLength: 60
        yearsInPractice:
          type: integer
          minimum: 0
          maximum: 70
        licensingBody:
          description: Issuing professional body.
          type: string
          minLength: 1
          maxLength: 160
        focusAreas:
          description: Help topic codes (/v1/catalogue/help-topics), up to 5 (D26).
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
        bio:
          description: Short bio, in the app language it was written in. The other language is drafted later and checked by the specialist before it goes live.
          type: string
          minLength: 1
          maxLength: 600
    SpecialistLanguages:
      type: object
      additionalProperties: false
      required: [languages]
      properties:
        languages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/SpecialistLanguage"
    SpecialistLanguage:
      type: object
      additionalProperties: false
      required: [code, proficiency]
      properties:
        code:
          description: A code from /v1/catalogue/session-languages.
          type: string
        proficiency:
          $ref: "#/components/schemas/Proficiency"
        verified:
          description: Read-only. True once a reviewer confirmed the level in the onboarding interview.
          type: boolean
          readOnly: true
    SpecialistServices:
      type: object
      additionalProperties: false
      required: [offerings]
      properties:
        offerings:
          description: One per modality; at least one enabled.
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/Offering"
    Offering:
      type: object
      additionalProperties: false
      required: [modality, enabled, durationMinutes, price]
      properties:
        modality:
          $ref: "#/components/schemas/Modality"
        enabled:
          type: boolean
        durationMinutes:
          description: One of pricing.durations.
          type: integer
        price:
          description: Whole FCFA (XAF), within pricing.minPrice and pricing.maxPrice.
          type: integer
          minimum: 0
    PayoutDetails:
      type: object
      additionalProperties: false
      required: [method, holderName]
      properties:
        method:
          $ref: "#/components/schemas/PayoutMethod"
        phone:
          description: The mobile money number; required for MTN_MOMO and ORANGE_MONEY. Returned masked.
          type: string
          maxLength: 20
        holderName:
          description: Account holder name; must match the name on the ID.
          type: string
          minLength: 1
          maxLength: 120
    SpecialistDocument:
      type: object
      additionalProperties: false
      required: [kind, files]
      properties:
        kind:
          $ref: "#/components/schemas/DocumentKind"
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fileName, contentType, size, uploadedAt]
            properties:
              fileName:
                type: string
              contentType:
                type: string
              size:
                description: Bytes.
                type: integer
              uploadedAt:
                type: string
                format: date-time
    SpecialistPricing:
      description: The rules for SpecServices, from admin settings.
      type: object
      additionalProperties: false
      required: [minPrice, maxPrice, feePercent, durations]
      properties:
        minPrice:
          type: integer
        maxPrice:
          type: integer
        feePercent:
          description: Solace's fee, taken from each completed session.
          type: number
        durations:
          description: Session lengths in minutes a specialist can choose.
          type: array
          items:
            type: integer
    SpecialistApplication:
      type: object
      additionalProperties: false
      required: [status, fullName, steps, languages, documents, offerings, pricing]
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        fullName:
          type: string
        steps:
          description: Which steps are complete, so the app can resume.
          type: object
          additionalProperties: false
          required: [practice, languages, documents, services, hours, payout]
          properties:
            practice:
              type: boolean
            languages:
              type: boolean
            documents:
              description: LICENCE, IDENTITY and PHOTO present; CV is optional.
              type: boolean
            services:
              type: boolean
            hours:
              type: boolean
            payout:
              type: boolean
        practice:
          $ref: "#/components/schemas/Practice"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/SpecialistLanguage"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/SpecialistDocument"
        offerings:
          type: array
          items:
            $ref: "#/components/schemas/Offering"
        payout:
          $ref: "#/components/schemas/PayoutDetails"
        pricing:
          $ref: "#/components/schemas/SpecialistPricing"
        submittedAt:
          type: string
          format: date-time
        interviewAt:
          description: When staff booked the onboarding interview (D25).
          type: string
          format: date-time
        reviewNote:
          description: The reviewer's reason, shown when changes are requested or the application is rejected. In the reviewer's words, not translated.
          type: string
    WeeklyHours:
      type: object
      additionalProperties: false
      required: [timeZone, days, breakMinutes, minimumNoticeHours]
      properties:
        timeZone:
          description: IANA time zone the times are in, e.g. Africa/Douala.
          type: string
          maxLength: 64
        days:
          type: array
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [weekday, ranges]
            properties:
              weekday:
                type: string
                enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
              ranges:
                type: array
                maxItems: 6
                items:
                  type: object
                  additionalProperties: false
                  required: [start, end]
                  properties:
                    start:
                      description: Local time, HH:mm.
                      type: string
                      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                    end:
                      description: Local time, HH:mm, after start.
                      type: string
                      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        breakMinutes:
          description: Break between sessions.
          type: integer
          enum: [0, 10, 15]
        minimumNoticeHours:
          description: How long before a session it can still be booked.
          type: integer
          enum: [2, 12, 24]
    VerifiedLevel:
      description: The level a reviewer confirmed in the interview. BELOW_PROFESSIONAL is never bookable.
      type: string
      enum: [NATIVE, FLUENT, PROFESSIONAL, BELOW_PROFESSIONAL]
    StaffRef:
      description: A staff member as activity logs name them.
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Verification:
      description: Who verified an item, and when.
      type: object
      additionalProperties: false
      required: [by, at]
      properties:
        by:
          $ref: "#/components/schemas/StaffRef"
        at:
          type: string
          format: date-time
    ItemVerification:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified:
          type: boolean
        licenceValidUntil:
          description: LICENCE only, required when verifying it.
          type: string
          format: date
    ApplicationQueue:
      type: object
      additionalProperties: false
      required: [counts, items]
      properties:
        counts:
          type: object
          additionalProperties: false
          required: [submitted, underReview, changesRequested]
          properties:
            submitted:
              type: integer
            underReview:
              type: integer
            changesRequested:
              type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, fullName, languages, status]
            properties:
              id:
                type: string
                format: uuid
              fullName:
                type: string
              profession:
                type: string
                description: Profession label in the caller's language.
              languages:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [code, proficiency]
                  properties:
                    code:
                      type: string
                    proficiency:
                      $ref: "#/components/schemas/Proficiency"
              status:
                $ref: "#/components/schemas/ApplicationStatus"
              submittedAt:
                type: string
                format: date-time
              assignedTo:
                $ref: "#/components/schemas/StaffRef"
    ApplicationReview:
      description: One application, or one specialist's record, as staff see it.
      type: object
      additionalProperties: false
      required: [id, status, fullName, verifiedItems, identity, licence, languages, services, profile, payout, documents, notes, activity]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        changesRequested:
          description: True while the application is back with the applicant after a change request.
          type: boolean
        fullName:
          type: string
        profession:
          type: string
        professionLabel:
          type: string
        timeZone:
          type: string
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        assignedTo:
          $ref: "#/components/schemas/StaffRef"
        interviewAt:
          type: string
          format: date-time
        reviewNote:
          description: The last reason sent to the applicant.
          type: string
        approvalProposal:
          description: Set while an approval waits for a second staff member (D29).
          $ref: "#/components/schemas/Verification"
        verifiedItems:
          description: How many of the six items are verified; approval needs all six.
          type: integer
        identity:
          type: object
          additionalProperties: false
          properties:
            verification:
              $ref: "#/components/schemas/Verification"
        licence:
          type: object
          additionalProperties: false
          properties:
            licenceNumber:
              type: string
            licensingBody:
              type: string
            yearsInPractice:
              type: integer
            validUntil:
              type: string
              format: date
            verification:
              $ref: "#/components/schemas/Verification"
        languages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, declared]
            properties:
              code:
                type: string
              declared:
                $ref: "#/components/schemas/Proficiency"
              verifiedLevel:
                $ref: "#/components/schemas/VerifiedLevel"
              verification:
                $ref: "#/components/schemas/Verification"
        services:
          type: object
          additionalProperties: false
          required: [offerings, withinBands]
          properties:
            offerings:
              type: array
              items:
                $ref: "#/components/schemas/Offering"
            withinBands:
              type: boolean
        profile:
          type: object
          additionalProperties: false
          properties:
            focusAreas:
              type: array
              items:
                type: string
            bioEn:
              type: string
            bioFr:
              type: string
            draftedLanguage:
              description: The bio language Solace drafted (D30); the specialist checks it before the profile goes live.
              $ref: "#/components/schemas/AppLanguage"
            verification:
              $ref: "#/components/schemas/Verification"
        payout:
          type: object
          additionalProperties: false
          properties:
            method:
              $ref: "#/components/schemas/PayoutMethod"
            phone:
              description: Masked.
              type: string
            holderName:
              type: string
            verification:
              $ref: "#/components/schemas/Verification"
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, fileName, contentType, size, uploadedAt]
            properties:
              id:
                type: string
                format: uuid
              kind:
                $ref: "#/components/schemas/DocumentKind"
              fileName:
                type: string
              contentType:
                type: string
              size:
                type: integer
              uploadedAt:
                type: string
                format: date-time
        notes:
          description: Reviewer notes, staff only.
          type: string
        activity:
          description: Newest first.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [at, kind]
            properties:
              at:
                type: string
                format: date-time
              kind:
                description: The portal words each kind in the viewer's language. The list grows as review steps are added, so clients show unknown kinds plainly.
                type: string
                x-extensible-enum: [SUBMITTED, OPENED, ITEM_VERIFIED, ITEM_UNVERIFIED, LANGUAGE_VERIFIED, BIO_ADDED, INTERVIEW_BOOKED, CHANGES_REQUESTED, APPROVAL_PROPOSED, APPROVAL_WITHDRAWN, APPROVED, REJECTED, SUSPENDED, REINSTATED]
              subject:
                description: The item or language code the entry is about, if any.
                type: string
              value:
                description: The level verified, if any.
                type: string
              by:
                $ref: "#/components/schemas/StaffRef"
    SpecialistSummary:
      type: object
      additionalProperties: false
      required: [id, fullName, status]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        professionLabel:
          type: string
        licenceNumber:
          type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
