          $ref: "#/components/responses/Conflict"
  /v1/catalogue/specialties:
    get:
      operationId: listSpecialties
      summary: Specialties in the caller's language (D31)
      tags: [catalogue]
      security: []
      responses:
        "200":
          description: Enabled specialties in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialty"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/catalogue/specialists:
    get:
      operationId: searchSpecialists
      summary: Find a specialist (Search screen); open to guests
      description: |
        The session language comes first: only specialists verified at Professional level or above
        in it are returned (System Design, Bilingual design). Ordered by relevance to the text when
        there is one, then the soonest availability. Labels are in the caller's language.
      tags: [catalogue]
      security: []
      parameters:
        - name: language
          in: query
          required: true
          description: Session language code from /v1/catalogue/session-languages.
          schema:
            type: string
        - name: modality
          in: query
          schema:
            $ref: "#/components/schemas/Modality"
        - name: q
          in: query
          description: What the seeker would like help with, in their words; matched against focus areas, professions, names and bios in EN and FR.
          schema:
            type: string
            maxLength: 120
        - name: specialty
          in: query
          schema:
            type: string
        - name: maxPrice
          in: query
          description: Whole FCFA.
          schema:
            type: integer
            minimum: 0
        - name: minRating
          in: query
          description: Only specialists with at least this average, from enough ratings to show one (D37).
          schema:
            type: number
            minimum: 1
            maximum: 5
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching specialists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
