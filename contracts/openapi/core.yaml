            properties:
              id:
                type: string
                format: uuid
              fullName:
                type: string
              profession:
                type: string
                description: Profession label in the caller's language.
              languages:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [code, proficiency]
                  properties:
                    code:
                      type: string
                    proficiency:
                      $ref: "#/components/schemas/Proficiency"
              status:
                $ref: "#/components/schemas/ApplicationStatus"
              submittedAt:
                type: string
                format: date-time
              assignedTo:
                $ref: "#/components/schemas/StaffRef"
    ApplicationReview:
      description: One application, or one specialist's record, as staff see it.
      type: object
      additionalProperties: false
      required: [id, status, fullName, verifiedItems, identity, licence, languages, services, profile, payout, documents, notes, activity]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        changesRequested:
          description: True while the application is back with the applicant after a change request.
          type: boolean
        fullName:
          type: string
        profession:
          type: string
        professionLabel:
          type: string
        timeZone:
          type: string
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        assignedTo:
          $ref: "#/components/schemas/StaffRef"
        interviewAt:
          type: string
          format: date-time
        reviewNote:
          description: The last reason sent to the applicant.
          type: string
        approvalProposal:
          description: Set while an approval waits for a second staff member (D29).
