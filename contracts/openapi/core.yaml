    HealthCheckQuestion:
      type: object
      additionalProperties: false
      required: [code, kind, multi, step, textEn, textFr, options]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 40
        kind:
          $ref: "#/components/schemas/HealthCheckQuestionKind"
        multi:
          type: boolean
        step:
          type: integer
          minimum: 1
          maximum: 2
        textEn:
          type: string
          maxLength: 300
        textFr:
          type: string
          maxLength: 300
        introEn:
          type: string
          maxLength: 300
        introFr:
          type: string
          maxLength: 300
        screener:
          type: string
          enum: [PHQ9, GAD7]
        item:
          type: integer
          minimum: 1
          maximum: 9
        locked:
          description: The safety question and screener items; set by Solace, never edited.
          type: boolean
        options:
          type: array
          minItems: 2
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [code, labelEn, labelFr]
            properties:
              code:
                type: string
                pattern: "^[a-z][a-z0-9_]*$"
                maxLength: 40
              labelEn:
                type: string
                maxLength: 120
              labelFr:
                type: string
                maxLength: 120
              value:
                description: Screener items only, 0 to 3.
                type: integer
              topic:
                description: The help topic this option means, for matching on focus areas.
                type: string
        showIf:
          $ref: "#/components/schemas/HealthCheckShowIf"
    HealthCheckRule:
      type: object
      additionalProperties: false
      required: [code, when, specialty, points, reasonEn, reasonFr]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_.]*$"
          maxLength: 60
        when:
          description: Every condition must hold.
          type: array
          minItems: 1
          maxItems: 3
          items:
