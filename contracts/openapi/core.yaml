openapi: 3.1.0
info:
  title: Solace Core API
  version: 0.1.0
  description: |
    Core: identity, marketplace, money, admin, health check.
    Reached through the gateway at /api/core. Phase 0 stub; endpoints are added with each epic.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/core
    description: Through the gateway (http://localhost:8080 locally)
security:
  - bearerAuth: []
tags:
  - name: system
    description: Platform plumbing, no user data
paths:
  /v1/system/ping:
    get:
      operationId: ping
      summary: Phase 0 end-to-end slice
      description: Core calls Tracking and AI over gRPC, publishes core.system.pinged through the outbox, and reports which services answered.
      tags: [system]
      responses:
        "200":
          description: Result of the ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      description: RFC 9457 problem details. title and detail are localised to the caller's language.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable error code, e.g. booking.slot-taken
        traceId:
          type: string
    PingResult:
      type: object
      additionalProperties: false
      required: [core, tracking, ai]
      properties:
        core:
          type: boolean
        tracking:
          type: boolean
          description: True when Tracking answered within the 2-second deadline.
        ai:
          type: boolean
          description: True when AI answered within the 2-second deadline.
