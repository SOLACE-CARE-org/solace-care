syntax = "proto3";

package solace.tracking.v1;

option java_multiple_files = true;
option java_package = "care.solace.contracts.tracking.v1";

// AI -> Tracking. Consented trend summary for a pre-session brief (Phase 3).
// 2-second deadline. Fallback: the brief is generated without tracking data.
// Notes are never included: they are storage only.
service TrendSummaryService {
  rpc GetTrendSummary(GetTrendSummaryRequest) returns (GetTrendSummaryResponse);
}

message GetTrendSummaryRequest {
  string seeker_subject_id = 1;
  // The booking the brief is for.
  string booking_id = 2;
  // The booking's specialist: Tracking answers only when the seeker shared with them.
  string specialist_subject_id = 3;
  // "en" or "fr", for element names.
  string locale = 4;
}

message TrendLine {
  string element_code = 1;
  // The element's name in the requested language.
  string element_name = 2;
  // Days with an entry in the window.
  int32 days_logged = 3;
  int32 window_days = 4;
  // For numbers and durations: the average over logged days. Absent for choices.
  optional double average = 5;
  // For choices: the most frequent value's label.
  string most_often = 6;
  // MINUTES, SCALE, CHOICE or YES_NO.
  string unit = 7;
}

message GetTrendSummaryResponse {
  // False when the seeker has not shared tracking data with this booking's specialist.
  bool shared = 1;
  // The last 14 days, oldest first; never notes.
  repeated TrendLine lines = 2;
}
