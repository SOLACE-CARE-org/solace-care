# Secrets come from Vault (System Design: Secrets) through the External Secrets Operator. Each
# environment's cluster has a ClusterSecretStore named "vault" scoped to that environment's path,
# so the keys below are the same everywhere. Every Vault key becomes an environment variable of the
# same name in the pod. Nothing secret is committed here.
#
# Vault key  -> variables it must hold
#   core     -> SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#               SOLACE_CORE_SERVICE_SECRET, SOLACE_CORE_ADMIN_SECRET,
#               SOLACE_STORAGE_ENDPOINT, SOLACE_STORAGE_ACCESS_KEY, SOLACE_STORAGE_SECRET_KEY
#               SPRING_DATA_REDIS_PASSWORD (slot holds)
#               (the object store for specialist credentials; its bucket is private)
#   tracking -> SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   ai       -> SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   gateway  -> SPRING_DATA_REDIS_PASSWORD
#   keycloak -> KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD,
#               KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD,
#               SOLACE_CODE_SENDER_SECRET (keycloak-code-sender, hands codes to Core)
#   core-payment-providers -> one file per provider key, mounted into Core, not as variables (D61):
#               <secret_ref>.public-key, <secret_ref>.private-key, <secret_ref>.webhook-secret
#               for each provider row whose secret_ref is not "config". Refreshed every minute;
#               Kubernetes updates the files in the pod without a restart.
#   core-message-senders -> the same for SMS and email senders (D61): <secret_ref>.api-key for an
#               SMS gateway, <secret_ref>.username and .password for a mail server.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: core
  dataFrom:
    - extract:
        key: core
---
