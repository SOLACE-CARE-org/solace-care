# Keycloak with Solace's authenticators and staff theme (infra/keycloak/Dockerfile). Pods find each
# other through the database (Keycloak's default jdbc-ping), so no discovery service is needed.
# Realms are not imported here; see infra/k8s/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: solace-keycloak
          args: [start, --optimized]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
            - name: cluster
              containerPort: 7800
          envFrom:
            - configMapRef:
                name: keycloak-settings
            # KC_DB_URL/USERNAME/PASSWORD, KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD (secrets.yaml)
            - secretRef:
                name: keycloak
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Keycloak writes only under data/ and /tmp at run time.
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
