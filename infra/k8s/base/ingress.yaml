# Three public hosts; overlays set the real names. TLS ends here (behind the WAF/CDN). The ingress
# class and certificate issuer depend on hosting and are set by the overlays.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solace
spec:
  tls:
    - hosts: [api.solace.example, admin.solace.example, id.solace.example]
      secretName: solace-tls
  rules:
    - host: api.solace.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
    - host: admin.solace.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  name: http
    # Only sign-in and the theme's files are public. Keycloak's admin console and admin API stay
    # inside the cluster: Core creates staff accounts through it (D7).
    - host: id.solace.example
      http:
        paths:
          - path: /realms/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          - path: /resources/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
