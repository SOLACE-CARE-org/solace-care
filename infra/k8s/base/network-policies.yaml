# Nothing reaches a Solace pod unless a rule below allows it. Outbound traffic stays open, because
# the databases, Kafka, Redis and Vault are platform services whose addresses depend on hosting.
#
# The ingress controller's namespace must carry the label solace.care/ingress: "true".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The internet reaches only the gateway, the admin portal and Keycloak, through the ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [gateway, admin, keycloak]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              solace.care/ingress: "true"
      ports:
        - port: 8080
---
# REST: only the gateway calls the services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-from-gateway
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [core, tracking, ai]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: 8080
---
# gRPC: only Core calls Tracking and AI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grpc-from-core
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [tracking, ai]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: core
      ports:
        - port: 9090
---
# Service tokens are fetched from Keycloak inside the cluster; Keycloak pods also talk to each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              solace.care/calls-keycloak: "true"
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: 7800
