# AI: safety monitor first (Phase 1), then the other AI features behind flags. REST through the gateway; gRPC for Core.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/component: service
spec:
  # No replicas field: the HorizontalPodAutoscaler owns the count.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: ai
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai
          image: solace-ai
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: solace-platform
            # SPRING_DATASOURCE_URL/USERNAME/PASSWORD (secrets.yaml)
            - secretRef:
                name: ai
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  labels:
    app.kubernetes.io/name: ai
spec:
  selector:
    app.kubernetes.io/name: ai
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Headless: Core's gRPC client resolves every pod and balances across them.
apiVersion: v1
kind: Service
metadata:
  name: ai-grpc
  labels:
    app.kubernetes.io/name: ai
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ai
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
