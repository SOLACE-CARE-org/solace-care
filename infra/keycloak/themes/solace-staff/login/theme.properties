# Staff sign-in for the solace-staff realm, built to design/screens/admin/source/Main.dc.html and
# FirstSignIn.dc.html. Pages not overridden here come from Keycloak's base theme inside our layout.
parent=base
import=common/keycloak
styles=generated/tokens.css generated/fonts.css css/solace.css
locales=en,fr
# Shown on the sign-in page; keep equal to SOLACE_STAFF_IDLE_TIMEOUT_SECONDS / 60 ([15] in D7).
solaceIdleMinutes=15
