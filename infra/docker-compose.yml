# Local development infrastructure for Solace.
#   docker compose -f infra/docker-compose.yml up -d && bash infra/scripts/smoke-check.sh
# Every credential here is a local-only default. Override any of them in infra/.env
# (copy infra/.env.example). Real environments take secrets from Vault, never from this file.

name: solace-care

x-restart: &restart
  restart: unless-stopped

services:
  # PostgreSQL 16, one database and one owner role per service, plus one for Keycloak.
  # The pgvector image is plain PostgreSQL 16 with the vector extension available (used by AI).
  postgres:
    <<: *restart
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-core}
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD:-tracking}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-ai}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"select 1 from pg_database where datname='keycloak'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka in KRaft mode (no ZooKeeper). Containers use kafka:19092, the host uses localhost:9092.
  kafka:
    <<: *restart
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics, including dead-letter topics, are declared by the services that own them.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["9092:9092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Holds the JSON Schemas from contracts/events/.
  schema-registry:
    <<: *restart
    image: confluentinc/cp-schema-registry:7.9.1
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Slot holds, OTP codes, rate limits, cached taxonomy.
  redis:
    <<: *restart
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. API on 9000, console on 9001.
  # MinIO stopped publishing images to Docker Hub, so this is Chainguard's build from source,
  # pinned by digest (Chainguard's free tier only tags "latest"). The image has no shell,
  # so there is no healthcheck; minio-init waits for it instead.
  minio:
    <<: *restart
    image: cgr.dev/chainguard/minio@sha256:c93745c56fccdaf0e5dcb88999a96a65a136428beb045ef5d546255a80d747a7
    user: "0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-solace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-solace-dev-only}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

  # Creates the buckets once MinIO answers, then exits.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:8d736271bb105639f2348d04186e748bbed63c5392e4ce86641453c11b53f3c8
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-solace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-solace-dev-only}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null 2>&1; do sleep 1; done &&
        mc mb --ignore-existing local/solace-credentials local/solace-content local/solace-exports local/solace-scribe-audio &&
        mc anonymous set none local/solace-credentials &&
        mc anonymous set none local/solace-exports &&
        mc anonymous set none local/solace-scribe-audio &&
        mc ilm rule add --expire-days 7 local/solace-scribe-audio > /dev/null 2>&1 || true &&
        echo buckets ready

  # Identity provider. Admin console on http://localhost:8180.
  # Realms solace-members and solace-staff are imported from keycloak/realms on first start (D23).
  # The Solace extension is loaded from its Gradle build output, so build it first:
  #   cd backend && ./gradlew :keycloak:otp-authenticator:jar
  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.3.1
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      - ../backend/keycloak/otp-authenticator/build/libs:/opt/keycloak/providers:ro
      # Staff sign-in theme; its generated assets come from `pnpm install` (infra/keycloak/themes).
      - ./keycloak/themes/solace-staff:/opt/keycloak/themes/solace-staff:ro
    environment:
      # Lets the logging code sender write sign-in codes to the Keycloak log. Local only.
      SOLACE_DEV_CODE_SENDER: enabled
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    ports: ["8180:8080"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Audio and video. Dev keys only; see livekit/livekit.yaml.
  livekit:
    <<: *restart
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    # Webhooks go to the gateway running on the host (D36).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis]

  # Audio-only recording for the session scribe (D57), only when both people consented. Start it with
  #   docker compose --profile scribe up -d
  # It writes to the private solace-scribe-audio bucket, which also expires objects after 7 days.
  egress:
    <<: *restart
    profiles: [scribe]
    image: livekit/egress:v1.9.0
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./livekit/egress.yaml:/etc/egress.yaml:ro
    depends_on: [livekit, redis, minio]

  # Observability: services send OTLP to the collector, which fans out to Tempo, Prometheus and Loki.
  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on: [tempo, prometheus, loki]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  tempo:
    <<: *restart
    image: grafana/tempo:2.8.1
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["3200:3200"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=7d
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  loki:
    <<: *restart
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes:
      - loki-data:/loki

  grafana:
    <<: *restart
    image: grafana/grafana:12.0.2
    depends_on: [tempo, prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  kafka-data:
  redis-data:
  minio-data:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
