# LiveKit for local development only. Real keys come from Vault.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
keys:
  # key: secret (local dev only; the secret must be at least 32 characters)
  devkey: solace-local-livekit-secret-0123456789
# Room and participant events go to Core, signed with the key above, for attendance (D36).
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8080/api/core/v1/webhooks/livekit
# Egress (the scribe's audio recording, D57) talks to the server through Redis.
redis:
  address: redis:6379
logging:
  level: info
