# Native builds of the mobile app on Expo's servers (EAS), started by hand. Builds run there, not
# on Windows, which also avoids the long-path limit described in mobile/README.md.
# Needs the EXPO_TOKEN secret and an EAS project linked once with `eas init` (mobile/README.md).
name: Mobile build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile in mobile/eas.json
        type: choice
        options: [development, preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android

permissions:
  contents: read

jobs:
  eas-build:
    name: EAS build (${{ inputs.profile }}, ${{ inputs.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 25.1.1
          token: ${{ secrets.EXPO_TOKEN }}
      # --no-wait: the build carries on at Expo; its link is printed here.
      - run: eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
