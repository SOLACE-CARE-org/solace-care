# Every pull request and every push to main: build and test everything, and refuse breaking
# contract changes and missing translations (the Phase 0 gate). Pushes to main also build, scan and
# publish the container images.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  TRIVY_IMAGE: aquasec/trivy:0.76.0

jobs:
  backend:
    name: Backend (Gradle build, unit and Testcontainers tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Also validates the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # build = compile with -Werror, Spotless check, unit tests, Testcontainers integration tests
      # (Postgres, Kafka, Redis, Keycloak), and the Spring Modulith boundary check.
      - run: ./gradlew build --no-daemon

  frontend:
    name: Mobile, admin and shared packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Also generates the design tokens and the sign-in theme assets (prepare scripts).
      - run: pnpm install --frozen-lockfile
      - name: Translations (every key in EN and FR, placeholders match, no "!" or emoji)
        run: pnpm --filter @solace/i18n check
      - name: Admin portal
        run: |
          pnpm --filter @solace/admin typecheck
          pnpm --filter @solace/admin test
          pnpm --filter @solace/admin build
      - name: Mobile app
        run: |
          pnpm --filter @solace/mobile typecheck
          pnpm --filter @solace/mobile test --ci

  contracts:
    name: Contracts (lint and breaking changes)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @solace/contracts
      - name: Lint (Buf, Redocly, event schemas)
        run: pnpm --filter @solace/contracts lint
      # The checks compare with main. A pull request's checkout has no local main branch, so make one.
      - name: Breaking changes against main (proto, OpenAPI, events)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          git branch --force main origin/main
          pnpm --filter @solace/contracts breaking

  manifests:
    name: Kubernetes manifests (render, validate, security checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the overlays
        run: |
          mkdir -p rendered
          for env in dev staging prod; do
            kubectl kustomize "infra/k8s/overlays/$env" > "rendered/$env.yaml"
          done
          cp infra/argocd/*.yaml rendered/
      - name: Validate against the Kubernetes and CRD schemas
        run: |
          docker run --rm -v "$PWD/rendered:/m:ro" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /m
      - name: Security checks (non-root, read-only, no privilege escalation, ...)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" config \
            --quiet --ignorefile .trivyignore --severity MEDIUM,HIGH,CRITICAL --exit-code 1 rendered

  images:
    name: Container images (build, scan, publish)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, contracts, manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Build the jars and the admin bundle
        run: |
          (cd backend && ./gradlew bootJar :keycloak:otp-authenticator:jar --no-daemon)
          pnpm install --frozen-lockfile
          pnpm --filter @solace/admin build
      - name: Build images
        run: |
          tag="${GITHUB_SHA::12}"
          for service in core tracking ai gateway; do
            docker build --build-arg SERVICE="$service" -t "$REGISTRY/solace-$service:$tag" backend
          done
          docker build -t "$REGISTRY/solace-admin:$tag" admin
          docker build -f infra/keycloak/Dockerfile -t "$REGISTRY/solace-keycloak:$tag" .
      # A fixable critical vulnerability stops the release; high ones are listed for follow-up.
      - name: Scan images
        run: |
          tag="${GITHUB_SHA::12}"
          for image in core tracking ai gateway admin keycloak; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
              "$REGISTRY/solace-$image:$tag"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --quiet --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 \
              "$REGISTRY/solace-$image:$tag"
          done
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Images are tagged with the commit; the Argo CD overlays pin that tag (infra/k8s).
      - name: Publish images
        run: |
          tag="${GITHUB_SHA::12}"
          for image in core tracking ai gateway admin keycloak; do
            docker push "$REGISTRY/solace-$image:$tag"
          done
