# Dependency, secret, misconfiguration and code scanning. Runs on pull requests, on main and weekly,
# so a newly published vulnerability in an unchanged dependency is still found.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    name: New dependencies (vulnerabilities and licences)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: on-failure

  trivy:
    name: Trivy (dependencies, secrets, IaC)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails on a committed secret or a fixable critical vulnerability in a lockfile.
      - name: Scan the repository
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.76.0 fs \
            --quiet --scanners vuln,secret --ignore-unfixed --severity CRITICAL --exit-code 1 \
            --skip-dirs node_modules .
      # Dockerfiles, Kubernetes manifests and compose: reported to code scanning, not blocking.
      - name: Scan configuration
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.76.0 config \
            --quiet --severity HIGH,CRITICAL --format sarif --output trivy-config.sarif .
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
