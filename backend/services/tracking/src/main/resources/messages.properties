# Titles of Tracking's errors, in English. Each key has its pair in messages_fr.properties.
error.tracking.seekers-only.title=Tracking is for seekers with an account.
error.tracking.consent-needed.title=Turn on tracking in Privacy & data first.
error.tracking.wrong-state.title=This can't be changed now.
error.tracking.same-person.title=Someone else has to approve what you drafted.
error.tracking.not-ready.title=Finish the details in English and French, the image and the elements first.
error.tracking.blocked-wording.title=This message uses wording that sounds like a diagnosis.
error.tracking.not-eligible.title=This module isn't available for your account.
error.tracking.no-access.title=You can't see this person's tracking.
error.tracking.image-too-large.title=The image must be at most 1 MB.
error.tracking.image-type.title=Use a JPG, PNG or WebP image.
error.tracking.image-size.title=The image must be 3:2 and at least 1200 by 800 pixels.
error.job.changed.title=Someone changed this job meanwhile. Reload it and try again.
error.job.schedule-invalid.title=This schedule is not valid. Use a cron with its time zone, or an interval of at least 5 seconds.
error.list.invalid.title=This version can't be used. Check its entries and try again.
error.list.not-draft.title=Only a draft can be signed off or declined.
error.list.same-person.title=Someone else must decide this version. You drafted it.
error.list.check-failed.title=This version did not pass its check. For safety phrases, the safety set must reach 99% in EN and FR.
