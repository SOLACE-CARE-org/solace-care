# Titres des erreurs du Suivi, en français. Chaque clé a son pendant dans messages.properties.
error.tracking.seekers-only.title=Le suivi est réservé aux usagers avec un compte.
error.tracking.consent-needed.title=Activez d'abord le suivi dans Confidentialité et données.
error.tracking.wrong-state.title=Ceci ne peut pas être modifié maintenant.
error.tracking.same-person.title=Une autre personne doit approuver ce que vous avez préparé.
error.tracking.not-ready.title=Terminez d'abord les détails en anglais et en français, l'image et les éléments.
error.tracking.blocked-wording.title=Ce message emploie des mots qui ressemblent à un diagnostic.
error.tracking.not-eligible.title=Ce module n'est pas disponible pour votre compte.
error.tracking.no-access.title=Vous ne pouvez pas voir le suivi de cette personne.
error.tracking.image-too-large.title=L'image doit faire au plus 1 Mo.
error.tracking.image-type.title=Utilisez une image JPG, PNG ou WebP.
error.tracking.image-size.title=L'image doit être au format 3:2 et faire au moins 1200 sur 800 pixels.
error.job.changed.title=Quelqu'un a modifié cette tâche entre-temps. Rechargez-la et réessayez.
error.job.schedule-invalid.title=Ce calendrier n'est pas valide. Utilisez une expression cron avec son fuseau horaire, ou un intervalle d'au moins 5 secondes.
