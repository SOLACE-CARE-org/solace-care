# Added to src/main/resources/application.yml for every Core test (Spring Boot reads both).
solace:
  notifications:
    # No SMS or email provider exists yet; tests read messages from the log.
    sender: logging
  payments:
    # No real money in tests: the sandbox aggregator approves at once (D35).
    provider: sandbox
    sandbox:
      approve-after: PT0S
    # Tests drive checks themselves.
    poll-interval: PT1H
