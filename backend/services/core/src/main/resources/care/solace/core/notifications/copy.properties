# English notification copy, word for word from docs/specs/notification-copy.md.
# {0}, {1}... are filled in code; numbers are passed as text so they are not formatted.

# Sign-in or sign-up code (SMS). {0} code, {1} minutes the code lives ([10]).
sms.sign-in-code=Solace: your code is {0}. It expires in {1} min. Never share it with anyone.
# Email has no wording of its own in the spec: the SMS wording is the body, its first sentence the subject.
email.sign-in-code.subject=Solace: your code is {0}.
email.sign-in-code.body=Solace: your code is {0}. It expires in {1} min. Never share it with anyone.

# --- Seekers and guests (epic 9). Placeholders: {0}, {1}... in the order noted. ---------------------
# Discreet mode: every push.
push.discreet=Solace: you have a reminder
# Booking confirmed. Push: {0} date, {1} time. SMS: {0} date, {1} time, {2} link.
push.booking-confirmed=Appointment booked: {0} at {1}.
sms.booking-confirmed=Solace: your appointment on {0} at {1} is confirmed. Details and join link: {2}
# Day before. {0} time.
push.day-before=Reminder: appointment tomorrow at {0}.
# Joining opens, 10 min before. {0} time; SMS {1} link.
push.join-opens=Your appointment starts at {0}. You can join now.
sms.join-opens=Solace: your appointment starts at {0}. Join here: {1}
# Payment received. {0} amount.
push.payment-received=Payment received: {0} FCFA. Your receipt is in the app.
# Payment not completed. {0} time; SMS {1} link.
push.payment-not-completed=Payment not completed. Your time is held until {0}.
sms.payment-not-completed=Solace: your payment was not completed. Your time is held until {0}. Try again: {1}
# Seeker cancelled (push or SMS). {0} amount.
push.seeker-cancelled=Appointment cancelled. A refund of {0} FCFA is on its way.
sms.seeker-cancelled=Appointment cancelled. A refund of {0} FCFA is on its way.
# Specialist cancelled. Push {0} date. SMS {0} date, {1} link.
push.specialist-cancelled=Your appointment on {0} was cancelled by the specialist. Full refund on its way. Pick a new time in the app.
sms.specialist-cancelled=Solace: your appointment on {0} was cancelled by the specialist. Full refund on its way. New time: {1}
# Rescheduled (push or SMS). {0} date, {1} time.
push.rescheduled=Appointment moved to {0} at {1}.
sms.rescheduled=Appointment moved to {0} at {1}.
# Refund sent (push or SMS). {0} amount, {1} method.
push.refund-sent=Solace: a refund of {0} FCFA has been sent to your {1} account.
sms.refund-sent=Solace: a refund of {0} FCFA has been sent to your {1} account.
# After the appointment.
push.rate-session=How was your appointment? Tell us in one tap.

# --- Specialists -------------------------------------------------------------------------------
push.application-received=Application received. We''ll tell you at each step.
push.changes-requested=Your application needs a change. Open Solace to see what.
# {0} date, {1} time.
push.interview-booked=Onboarding interview booked: {0} at {1}.
push.approved=You''re approved. Seekers can now find and book you.
push.decision-made=There''s an update on your application. Open Solace to read it.
# {0} date, {1} time, {2} modality, {3} language.
push.new-booking=New session: {0} at {1} · {2} · {3}.
# {0} date, {1} time.
push.session-cancelled-by-seeker=The session on {0} at {1} was cancelled by the seeker.
# {0} language, {1} time.
push.specialist-soon=Your {0} session at {1} starts in 10 minutes.
# {0} amount, {1} method.
push.payout-sent=Payout sent: {0} FCFA to {1}.
push.payout-failed=Your payout couldn''t be sent. Check your payout details in Solace.
push.new-review=You have a new review.

# --- Emails: subject, then first line ----------------------------------------------------------
# Receipt. {0} date, {1} amount.
email.receipt.subject=Your Solace receipt, {0}.
email.receipt.body=Thank you for your payment of {1} FCFA.
email.application-received.subject=We''ve received your application.
email.application-received.body=We check every specialist before seekers can book them.
email.application-decision.subject=An update on your Solace application.
email.application-decision.body=Open the app to read the decision and the reason.
# Payout statement. {0} period, {1} amount, {2} method.
email.payout-statement.subject=Your Solace payout, {0}.
email.payout-statement.body={1} FCFA was sent to {2}.
email.payout-failed.subject=Your payout couldn''t be sent.
email.payout-failed.body=Check your payout details in Solace.

# Words inside messages, in the recipient's language.
word.AUDIO=audio
word.VIDEO=video
word.MTN_MOMO=MTN MoMo
word.ORANGE_MONEY=Orange Money

# --- Staff: crisis alerts (D11, D15, D39). {0} category, {1} time raised. --------------------------
sms.crisis-alert=Solace crisis alert: {0}, raised {1}. Open the crisis queue now.
sms.crisis-backup=Solace: a crisis alert has waited 5 min. You are the backup. Open the crisis queue now.
sms.crisis-admins=Solace: a crisis alert is still not acknowledged after 5 min. Open the crisis queue now.
category.SUICIDAL_IDEATION=suicidal ideation
category.SELF_HARM=self-harm
category.ACUTE_ANXIETY=acute anxiety
category.VIOLENT_THOUGHTS=violent thoughts
category.SUBSTANCE_CRISIS=substance crisis
category.RISK_TAKING=risk-taking
category.UNKNOWN=category unknown

# --- Privacy (D40) ------------------------------------------------------------------------------
push.data-copy-ready=Your copy of your data is ready. It can be downloaded for {0} days.
email.data-copy-ready.subject=Your Solace data is ready.
email.data-copy-ready.body=Download it from the app within {0} days.
email.account-deleted.subject=Your Solace account has been deleted.
email.account-deleted.body=We have removed your account and your data, except records the law requires us to keep.
