# English notification copy, word for word from docs/specs/notification-copy.md.
# {0}, {1}... are filled in code; numbers are passed as text so they are not formatted.

# Sign-in or sign-up code (SMS). {0} code, {1} minutes the code lives ([10]).
sms.sign-in-code=Solace: your code is {0}. It expires in {1} min. Never share it with anyone.
# Email has no wording of its own in the spec: the SMS wording is the body, its first sentence the subject.
email.sign-in-code.subject=Solace: your code is {0}.
email.sign-in-code.body=Solace: your code is {0}. It expires in {1} min. Never share it with anyone.
