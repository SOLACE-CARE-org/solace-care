# Core service. Defaults point at the local stack in infra/docker-compose.yml; every value can
# be overridden with an environment variable (SPRING_DATASOURCE_URL and so on).
spring:
  application:
    name: core
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/core
    username: core
    password: core
  kafka:
    bootstrap-servers: localhost:9092
  servlet:
    multipart:
      # Credential documents: IDENTITY takes two files of up to solace.specialists.documents.max-file-size.
      max-file-size: ${solace.specialists.documents.max-file-size:10MB}
      max-request-size: 25MB
  grpc:
    server:
      port: 9101
    client:
      channels:
        # Plain text locally; mTLS between services in the cluster (System Design).
        tracking:
          address: static://localhost:9102
          negotiation-type: plaintext
          default-load-balancing-policy: round_robin
        ai:
          address: static://localhost:9103
          negotiation-type: plaintext
          default-load-balancing-policy: round_robin
  security:
    oauth2:
      client:
        # Core's own client-credentials token for its gRPC calls (infra/keycloak: core-service).
        registration:
          keycloak:
            provider: keycloak
            client-id: core-service
            client-secret: ${SOLACE_CORE_SERVICE_SECRET:core-service-dev-secret}
            authorization-grant-type: client_credentials
          # Creates and updates member sign-in identities (manage-users only).
          keycloak-members-admin:
            provider: keycloak-members
            client-id: core-admin
            client-secret: ${SOLACE_CORE_ADMIN_SECRET:core-admin-dev-secret}
            authorization-grant-type: client_credentials
          # Creates staff accounts and ends their sessions (staff realm, manage-users only; D42).
          keycloak-staff-admin:
            provider: keycloak
            client-id: core-admin
            client-secret: ${SOLACE_CORE_STAFF_ADMIN_SECRET:core-admin-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/solace-staff/protocol/openid-connect/token
          keycloak-members:
            token-uri: http://localhost:8180/realms/solace-members/protocol/openid-connect/token

server:
  port: 8101

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

solace:
  security:
    audience: core
    # Open without a token: health checks, seeker and specialist sign-up, and the catalogue.
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /v1/signups
      - /v1/specialist-signups
      - /v1/slot-holds
      - /v1/slot-holds/**
      # Guests have no Keycloak token; Core checks their booking-scoped token itself (D34).
      - /v1/guest/**
      # The aggregator has no token either; Core checks each webhook's signature (D35, D36).
      - /v1/webhooks/**
      - /v1/catalogue/**
      # Feature flags the apps read before anyone signs in (D42).
      - /v1/config
      # Published legal texts and crisis resources, read before sign-in and by guests (D44).
      - /v1/content
      - /v1/content/**
  identity:
    members-issuer: http://localhost:8180/realms/solace-members
    keycloak:
      admin-url: http://localhost:8180
  notifications:
    # Which SMS and email provider sends messages. No provider is chosen yet (decisions.md), so
    # nothing is set here and Core will not start without one: local runs and the dev cluster set
    # "logging", which writes messages to the log. Never set "logging" anywhere real people are.
    sender: ${SOLACE_NOTIFICATIONS_SENDER:}
    # Push through Expo's service (D38); local runs, tests and the dev cluster log pushes instead.
    push-sender: ${SOLACE_NOTIFICATIONS_PUSH_SENDER:expo}
    expo-access-token: ${SOLACE_NOTIFICATIONS_EXPO_ACCESS_TOKEN:}
    # Staff browser notifications (D47): Solace's VAPID key pair, base64url (public: the 65-byte
    # point; private: the 32-byte scalar). Unset, staff pushes are only logged.
    vapid:
      public-key: ${SOLACE_NOTIFICATIONS_VAPID_PUBLIC_KEY:}
      private-key: ${SOLACE_NOTIFICATIONS_VAPID_PRIVATE_KEY:}
      subject: ${SOLACE_NOTIFICATIONS_VAPID_SUBJECT:mailto:ops@solace.care}
  payments:
    # The aggregator adapter (D35): notchpay, or sandbox where no real money may move. Nothing is
    # set here, so Core will not start without a choice: local runs and the dev cluster set sandbox.
    provider: ${SOLACE_PAYMENTS_PROVIDER:}
    notchpay:
      public-key: ${SOLACE_PAYMENTS_NOTCHPAY_PUBLIC_KEY:}
      private-key: ${SOLACE_PAYMENTS_NOTCHPAY_PRIVATE_KEY:}
      webhook-secret: ${SOLACE_PAYMENTS_NOTCHPAY_WEBHOOK_SECRET:}
  sessions:
    # The media server (LiveKit). Local defaults match infra/livekit/livekit.yaml; real keys come
    # from Vault.
    url: ${SOLACE_SESSIONS_URL:ws://localhost:7880}
    api-url: ${SOLACE_SESSIONS_API_URL:http://localhost:7880}
    api-key: ${SOLACE_SESSIONS_API_KEY:devkey}
    api-secret: ${SOLACE_SESSIONS_API_SECRET:solace-local-livekit-secret-0123456789}
  specialists:
    pricing:
      # SpecServices' [Min] and [Max]: 5,000 to 20,000 FCFA per session (D27). Settings, not constants.
      min-price: ${SOLACE_SPECIALISTS_PRICING_MIN_PRICE:5000}
      max-price: ${SOLACE_SPECIALISTS_PRICING_MAX_PRICE:20000}
      # SpecServices' [n]%: Solace's fee, 20% for now (D28). A setting, not a constant.
      fee-percent: ${SOLACE_SPECIALISTS_PRICING_FEE_PERCENT:20}
  storage:
    endpoint: ${SOLACE_STORAGE_ENDPOINT:http://localhost:9000}
  grpc:
    client-registration: keycloak
