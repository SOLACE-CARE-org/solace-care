# Core service. Defaults point at the local stack in infra/docker-compose.yml; every value can
# be overridden with an environment variable (SPRING_DATASOURCE_URL and so on).
spring:
  application:
    name: core
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/core
    username: core
    password: core
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8101

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

solace:
  security:
    audience: core
