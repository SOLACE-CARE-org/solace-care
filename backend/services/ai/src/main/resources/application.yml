# AI service. Defaults point at the local stack in infra/docker-compose.yml; every value can
# be overridden with an environment variable (SPRING_DATASOURCE_URL and so on).
spring:
  application:
    name: ai
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ai
    username: ai
    password: ai
  kafka:
    bootstrap-servers: localhost:9092
  grpc:
    server:
      port: 9103
    client:
      channels:
        # The pre-session brief reads from Core and Tracking (Phase 3, D56). Plain text locally;
        # mTLS in the cluster.
        core:
          address: static://localhost:9101
          negotiation-type: plaintext
          default-load-balancing-policy: round_robin
        tracking:
          address: static://localhost:9102
          negotiation-type: plaintext
          default-load-balancing-policy: round_robin
  security:
    oauth2:
      client:
        # AI's client-credentials token for its calls to Core and Tracking (infra/keycloak: ai-service).
        registration:
          keycloak:
            provider: keycloak
            client-id: ai-service
            client-secret: ${SOLACE_AI_SERVICE_SECRET:ai-service-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/solace-staff/protocol/openid-connect/token

server:
  port: 8103

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

solace:
  security:
    audience: ai
  grpc:
    client-registration: keycloak
  ai:
    # Models the gateway may use (D56). None by default: every feature stays off until a model is
    # chosen, configured here and evaluated. Health data goes only to local models until the
    # transfer authorisation is recorded (transfer-authorised).
    models: []
    routes: {}
    transfer-authorised: false
    retention-days: 30
    # Speech-to-text for the scribe and embeddings for the companion's corpus (D57). None by
    # default: session audio and answers go only to local models, once chosen and evaluated.
    speech: []
    embeddings: []
    # Seals notes, transcripts and homework records (AES-256-GCM). Production sets
    # SOLACE_AI_NOTES_KEY from the vault.
    notes-key: ${SOLACE_AI_NOTES_KEY:LUEiwb8Kc+BMzRrsPliTQMNRCYRiZVBUKn6AhShVWC8=}
    scribe:
      # The private bucket the media server's egress writes session audio to (infra: scribe profile).
      endpoint: ${SOLACE_SCRIBE_S3_ENDPOINT:http://localhost:9000}
      bucket: solace-scribe-audio
      access-key: ${SOLACE_SCRIBE_S3_ACCESS_KEY:solace}
      secret-key: ${SOLACE_SCRIBE_S3_SECRET_KEY:solace-dev-only}
    homework:
      # Homework is due before the next session, or after [7] days.
      default-due: P7D
