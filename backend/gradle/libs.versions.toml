[versions]
java = "21"
# Spring Boot 3 is fixed by CLAUDE.md; Modulith 1.4 and Spring gRPC 0.x are the Boot 3.5 lines.
spring-boot = "3.5.16"
spring-modulith = "1.4.13"
spring-grpc = "0.12.0"
resilience4j = "2.3.0"
# Must match the protobuf and grpc-java versions in the Spring gRPC 0.12 BOM.
protobuf = "4.32.1"
grpc = "1.76.0"
junit = "5.12.2"
assertj = "3.27.3"
spotless = "7.2.1"
google-java-format = "1.28.0"
keycloak = "26.3.1"
testcontainers-keycloak = "3.7.0"
# 1.21.4+ speaks the Docker API version that Docker Engine 29 requires
testcontainers = "1.21.4"
jackson = "2.19.1"
slf4j = "2.0.17"
json-schema-validator = "1.5.9"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-grpc-bom = { module = "org.springframework.grpc:spring-grpc-dependencies", version.ref = "spring-grpc" }
resilience4j-bom = { module = "io.github.resilience4j:resilience4j-bom", version.ref = "resilience4j" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

keycloak-core = { module = "org.keycloak:keycloak-core", version.ref = "keycloak" }
keycloak-server-spi = { module = "org.keycloak:keycloak-server-spi", version.ref = "keycloak" }
keycloak-server-spi-private = { module = "org.keycloak:keycloak-server-spi-private", version.ref = "keycloak" }
keycloak-services = { module = "org.keycloak:keycloak-services", version.ref = "keycloak" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-keycloak = { module = "com.github.dasniko:testcontainers-keycloak", version.ref = "testcontainers-keycloak" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# Used by build-logic to apply plugins from convention scripts
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
protobuf = { id = "com.google.protobuf", version = "0.9.5" }
