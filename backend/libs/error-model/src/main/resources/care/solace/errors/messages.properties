# Titles for problem responses. Apps show their own screen copy keyed on "code";
# these titles are the fallback text for API clients and support tools.
error.request.invalid.title=The request is not valid.
error.auth.required.title=Sign-in is required.
error.access.denied.title=No access
error.resource.not-found.title=Not found.
error.resource.conflict.title=This conflicts with the current state.
error.request.too-large.title=The file is too large.
error.rate-limited.title=Too many requests. Try again shortly.
error.dependency.unavailable.title=Service temporarily unavailable.
error.internal.title=Something went wrong.
