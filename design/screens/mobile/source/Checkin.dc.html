<button type="button" aria-label="Less sleep" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #7F8B84; background: #FFFFFF; color: #14201C; font: 600 20px Figtree, sans-serif">−</button>

<textarea id="note" rows="3" placeholder="Anything you want to remember about today" style="resize: none; padding: 12px 14px; border-radius: 14px; border: 1px solid #7F8B84; background: #F4F6F2; font: 400 15px/1.4 Figtree, sans-serif; color: #14201C">Couldn't switch off after work.</textarea>
