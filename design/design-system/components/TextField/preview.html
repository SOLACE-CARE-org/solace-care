<!-- @dsCard group="Inputs" height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0">
<div class="sl-root">
<div class="sl-stack sl-phone">
<div class="sl-field"><label class="sl-field__label" for="tf-phone">Phone number</label><input id="tf-phone" class="sl-input" value="+237 6 77 00 00 00"><span class="sl-field__help">We send a 6-digit code by SMS.</span></div>
<div class="sl-field"><label class="sl-field__label" for="tf-code">Code</label><input id="tf-code" class="sl-input sl-input--invalid" value="482 1"><span class="sl-field__error">That code isn't right. 2 tries left.</span></div>
<input id="tf-chat" class="sl-input sl-input--chat" placeholder="Type your answer…" aria-label="Your answer">
</div>
<div class="sl-field" style="margin-top:14px;max-width:520px"><label class="sl-field__label" for="tf-admin">Search the audit log</label><input id="tf-admin" type="search" class="sl-input sl-input--admin" placeholder="Staff member, person, booking or specialist"></div>
</div>
</body>
</html>
