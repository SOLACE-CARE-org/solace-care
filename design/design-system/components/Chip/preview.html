<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0">
<div class="sl-root">
<div class="sl-row" role="group" aria-label="Language">
<button type="button" class="sl-chip" aria-pressed="true">Français</button>
<button type="button" class="sl-chip" aria-pressed="false">English</button>
<button type="button" class="sl-chip" aria-pressed="false">Video</button>
<button type="button" class="sl-chip" aria-pressed="false">Audio only</button>
</div>
<div class="sl-row" style="margin-top:12px" role="group" aria-label="Flow">
<button type="button" class="sl-chip sl-chip--pink" aria-pressed="false">Light</button>
<button type="button" class="sl-chip sl-chip--pink" aria-pressed="true">Medium</button>
<button type="button" class="sl-chip sl-chip--pink" aria-pressed="false">Heavy</button>
</div>
</div>
</body>
</html>
